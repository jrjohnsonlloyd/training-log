name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Two jobs, as in GitHub's own Pages template: when the deploy step ran in the same job right
  # after the upload, it often asked for the artifact before GitHub listed it ("Found 0 artifact(s)").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      # Publish only what the app needs. Tests, scripts and source data stay out of the live site
      # (the UI test page clears stored data, so it must never be reachable next to the app).
      - name: Collect the app files
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest food-library.json food-db.json icons .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
