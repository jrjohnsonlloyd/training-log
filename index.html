<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lloyd's Training Log</title>
<meta name="description" content="Log workouts live with a session timer, then track consistency, strength progression, heart rate and weekly volume.">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f5f8">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121519">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Training Log">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-first column, sticky tab bar, cards reserved for the live session and the four stat tiles. */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --fg:#141a22; --fg-2:#5b6472; --muted:#858d99; --line:#e1e4ea; --grid:#e9ebef;
  --accent:#1f5fd0; --accent-fg:#ffffff; --accent-soft:#e4edfb;
  --s1:#2a78d6; --s2:#eb6834;
  --heat1:#b7d3f6; --heat2:#5598e7; --heat3:#1c5cab;
  --good:#0a8a0a; --critical:#d03b3b;
  --shadow:0 6px 18px rgba(20,26,34,.12);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121519; --surface:#1b1f25; --fg:#f2f4f7; --fg-2:#aeb6c2; --muted:#7f8792; --line:#2a3039; --grid:#262c35;
    --accent:#4f8fee; --accent-fg:#0b1220; --accent-soft:#1c2a44;
    --s1:#3987e5; --s2:#d95926;
    --heat1:#184f95; --heat2:#2a78d6; --heat3:#86b6ef;
    --good:#2fbf2f; --critical:#e66767;
    --shadow:0 6px 18px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121519; --surface:#1b1f25; --fg:#f2f4f7; --fg-2:#aeb6c2; --muted:#7f8792; --line:#2a3039; --grid:#262c35;
  --accent:#4f8fee; --accent-fg:#0b1220; --accent-soft:#1c2a44;
  --s1:#3987e5; --s2:#d95926;
  --heat1:#184f95; --heat2:#2a78d6; --heat3:#86b6ef;
  --good:#2fbf2f; --critical:#e66767;
  --shadow:0 6px 18px rgba(0,0,0,.45);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-block:20px 10px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:22px;line-height:1.1;margin:0 0 10px;text-wrap:balance}
h3{font-size:14px;font-weight:600;margin:0 0 6px}
p{margin:0 0 10px}
.lede{color:var(--fg-2);max-width:60ch}
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:4px;background:var(--bg);padding-block:8px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;font:inherit;font-family:var(--display);font-size:18px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;padding:9px 8px;border:0;border-radius:6px;background:transparent;color:var(--fg-2);cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-fg)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:13px;color:var(--fg-2);padding-block:8px 0;min-height:1.2em}
.status.warn{color:var(--critical)} .status.ok{color:var(--good)}
section{margin-block:22px}
.btn{font:inherit;font-weight:600;padding:11px 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.big{width:100%;font-family:var(--display);font-size:26px;text-transform:uppercase;letter-spacing:.04em;padding:18px}
.btn.danger{color:var(--critical)}
.btn.small{padding:6px 10px;font-size:13px;font-weight:500}
.btn:disabled{opacity:.5;cursor:default}
.btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btn-row .btn{flex:1 1 160px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:0;width:100%}
textarea{resize:vertical;min-height:56px}
input[type=number]{font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--fg-2);font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 130px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:560px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0}
.tile .v{font-family:var(--display);font-size:36px;font-weight:700;line-height:1;margin-top:4px}
.tile .v small{font-size:16px;font-weight:600;color:var(--fg-2);margin-left:2px;font-family:var(--body)}
.tile .c{font-size:12px;color:var(--muted);margin-top:4px}
.session{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.session-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:12px}
.session-head .f{flex:0 1 160px}
.elapsed{font-family:var(--display);font-size:48px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.ex{border-top:1px solid var(--line);padding-block:12px}
.ex-head{display:flex;gap:8px;align-items:center}
.ex-head input{font-weight:600;flex:1}
.kind{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.kind button{font:inherit;font-size:12px;font-weight:600;padding:7px 9px;border:0;background:transparent;color:var(--fg-2);cursor:pointer}
.kind button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 34px;gap:6px;align-items:center;margin-top:10px}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sets .n{font-variant-numeric:tabular-nums;color:var(--muted);text-align:center;font-size:13px}
.x{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:20px;line-height:1;padding:4px;border-radius:6px;width:34px;height:34px}
.x:hover{color:var(--critical);background:var(--bg)}
.add-set{margin-top:8px}
.finish{border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--fg-2)}
.chart-wrap{position:relative}
.chart{display:block;max-width:100%}
.chart .grid{stroke:var(--grid);stroke-width:1}
.chart .base{stroke:var(--line);stroke-width:1}
.chart .tick{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .cross{stroke:var(--muted);stroke-dasharray:3 3}
.tip{position:absolute;top:6px;transform:translateX(-50%);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:12px;box-shadow:var(--shadow);pointer-events:none;white-space:nowrap;z-index:2}
.tip-h{color:var(--muted);margin-bottom:2px}
.tip-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.tip-row b{font-variant-numeric:tabular-nums}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.legend{display:flex;gap:14px;font-size:12px;color:var(--fg-2);margin-bottom:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.controls{display:flex;gap:8px;margin-bottom:10px}
.controls select{flex:1}
.heat-wrap{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:start}
.heat-months{display:grid;grid-column:2;font-size:11px;color:var(--muted);height:14px;position:relative}
.heat-days{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:10px;color:var(--muted);line-height:1}
.heat-days span{display:flex;align-items:center;aspect-ratio:1}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat div{aspect-ratio:1;border-radius:2px;background:var(--grid);max-width:100%}
.heat .h1{background:var(--heat1)} .heat .h2{background:var(--heat2)} .heat .h3{background:var(--heat3)}
.heat-key{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);margin-top:8px;justify-content:flex-end}
.heat-key i{width:11px;height:11px;border-radius:2px;background:var(--grid);display:inline-block}
.heat-key i.h1{background:var(--heat1)} .heat-key i.h2{background:var(--heat2)} .heat-key i.h3{background:var(--heat3)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;padding:6px 4px;border-bottom:1px solid var(--line)}
td{padding:7px 4px;border-bottom:1px solid var(--grid)}
td.num,th.num{text-align:right}
.month{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
details.hist{border-top:1px solid var(--line)}
details.hist summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 0}
details.hist summary::-webkit-details-marker{display:none}
.d{font-family:var(--display);font-weight:700;line-height:1;text-align:center}
.d b{display:block;font-size:22px}
.d span{font-size:11px;font-family:var(--body);font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.sum{min-width:0}
.sum .t{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sum .s{font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:13px;color:var(--fg-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hist-body{padding:0 0 14px 62px;font-size:14px}
.hist-body ul{margin:0 0 8px;padding-left:18px}
.hist-body li{margin:2px 0}
.hist-body .note{color:var(--fg-2);font-style:italic}
@media (max-width:420px){.hist-body{padding-left:0}}
.pill{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.empty{color:var(--fg-2);padding:18px 16px;border:1px dashed var(--line);border-radius:8px;text-align:center}
.weekdots{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:6px}
.weekdots div{text-align:center;font-size:11px;color:var(--muted)}
.weekdots i{display:block;height:10px;border-radius:5px;background:var(--grid);margin-bottom:4px}
.weekdots .on i{background:var(--accent)}
.weekdots .today{color:var(--fg);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px;box-shadow:var(--shadow)}
.icon-btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--fg-2);border-radius:8px;width:40px;height:40px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.icon-btn svg{width:20px;height:20px}
.chip-row{display:flex;gap:8px;flex-wrap:wrap}
.hr-note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){.btn{transition:transform .08s}.btn:active{transform:scale(.98)}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <span class="eyebrow" id="todayLabel">Training log</span>
      <h1>Lloyd's Training Log</h1>
    </div>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h0a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v0a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg>
    </button>
  </header>

  <div class="panel" id="settingsPanel" hidden>
    <h2>Settings</h2>
    <div class="row">
      <label class="f">Weekly target (workouts)<input type="number" id="setTarget" min="1" max="14" step="1"></label>
      <label class="f">Weight unit<select id="setWeight"><option value="lb">Pounds (lb)</option><option value="kg">Kilograms (kg)</option></select></label>
      <label class="f">Distance unit<select id="setDist"><option value="mi">Miles</option><option value="km">Kilometers</option></select></label>
    </div>
    <div class="btn-row">
      <button class="btn primary" id="saveSettings">Save settings</button>
      <button class="btn" id="closeSettings">Close</button>
    </div>
    <h3 style="margin-top:18px">Backup</h3>
    <p class="hr-note" id="backupInfo"></p>
    <div class="chip-row">
      <button class="btn small" id="shareBackup">Share backup</button>
      <button class="btn small" id="downloadBackup">Download backup</button>
      <button class="btn small" id="copyBackup">Copy as text</button>
      <button class="btn small" id="restoreBtn">Restore from file</button>
      <input type="file" id="restoreFile" accept="application/json,.json" hidden>
    </div>
  </div>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="progress" aria-selected="false">Progress</button>
    <button role="tab" data-tab="history" aria-selected="false">History</button>
  </nav>
  <div class="status" id="status" role="status" aria-live="polite"></div>
  <main id="view"></main>
  <datalist id="exnames"></datalist>
</div>

<script>
(function(){
'use strict';
const DEFAULT_SETTINGS = { weeklyTarget: 4, weightUnit: 'lb', distUnit: 'mi' };
const TYPES = ['Strength', 'Cardio', 'Mobility', 'Sport', 'Other'];
const STARTER_NAMES = ['Squat','Bench press','Deadlift','Overhead press','Barbell row','Pull-up','Lat pulldown','Leg press','Romanian deadlift','Dumbbell curl','Dip','Run','Cycle','Row (erg)','Walk'];
const state = {
  workouts: [], settings: {...DEFAULT_SETTINGS}, active: null,
  tab: 'today', loaded: false, backend: 'none', canWrite: true,
  progEx: null, progMetric: 'e1rm', confirmDelete: null, confirmDiscard: false
};
const $ = s => document.querySelector(s);
const view = $('#view');

/* ---------- helpers ---------- */
const pad = n => String(n).padStart(2, '0');
const dateStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayStr = () => dateStr(new Date());
function parseDate(s){ const p = String(s || '').split('-').map(Number); return new Date(p[0] || 1970, (p[1] || 1) - 1, p[2] || 1); }
function addDays(d, n){ const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function mondayOf(d){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
const fmtNum = (n, d) => Number(n || 0).toLocaleString(undefined, { maximumFractionDigits: d == null ? 0 : d });
const fmtDur = min => { min = Math.round(min || 0); const h = Math.floor(min / 60), m = min % 60; return h ? h + 'h ' + pad(m) + 'm' : m + ' min'; };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const norm = s => String(s || '').trim().toLowerCase();
const clone = o => JSON.parse(JSON.stringify(o));
const LB_PER_KG = 2.20462, KM_PER_MI = 1.60934;
const convW = (v, from, to) => (!v || from === to) ? v : (from === 'kg' ? v * LB_PER_KG : v / LB_PER_KG);
const convD = (v, from, to) => (!v || from === to) ? v : (from === 'mi' ? v * KM_PER_MI : v / KM_PER_MI);
const e1rm = (w, r) => r > 1 ? w * (1 + r / 30) : w;
function lsGet(k, d){ try { const v = localStorage.getItem('tl.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function lsSet(k, v){ try { if (v == null) localStorage.removeItem('tl.' + k); else localStorage.setItem('tl.' + k, JSON.stringify(v)); } catch (e) {} }
let statusTimer = null;
function setStatus(msg, kind){ const s = $('#status'); s.textContent = msg || ''; s.className = 'status' + (kind ? ' ' + kind : ''); clearTimeout(statusTimer); if (kind === 'ok') statusTimer = setTimeout(() => { if (s.textContent === msg) { s.textContent = ''; s.className = 'status'; } }, 4000); }

/* ---------- storage: this device only, with backup and restore ---------- */
function lsPut(k, v){ try { if (v == null) localStorage.removeItem('tl.' + k); else localStorage.setItem('tl.' + k, JSON.stringify(v)); } catch (e) { throw new Error('this device refused to store it (storage full or blocked)'); } }
const store = {
  async init(){
    state.backend = 'local';
    state.workouts = lsGet('workouts', []); sortWorkouts();
    state.settings = Object.assign({}, DEFAULT_SETTINGS, lsGet('settings', {}));
    state.active = lsGet('active', null);
    state.loaded = true;
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
    render();
  },
  async saveWorkout(w){ const i = state.workouts.findIndex(x => x.id === w.id); if (i >= 0) state.workouts[i] = w; else state.workouts.push(w); sortWorkouts(); lsPut('workouts', state.workouts); render(); },
  async deleteWorkout(id){ state.workouts = state.workouts.filter(x => x.id !== id); lsPut('workouts', state.workouts); render(); },
  async saveSettings(s){ state.settings = s; lsPut('settings', s); render(); },
  async saveActive(a){ lsPut('active', a); }
};
function backupName(){ return 'training-log-backup-' + todayStr() + '.json'; }
function backupJson(){ return JSON.stringify({ app: 'training-log', version: 1, exportedAt: new Date().toISOString(), settings: state.settings, workouts: state.workouts }, null, 1); }
function lastBackupText(){ const t = lsGet('lastBackup', null); return t ? new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : 'never'; }
function markBackedUp(){ lsSet('lastBackup', Date.now()); renderBackupInfo(); lastKey = ''; render(); }
function renderBackupInfo(){ const el = $('#backupInfo'); if (el) el.textContent = state.workouts.length + (state.workouts.length === 1 ? ' workout' : ' workouts') + ' stored on this device · last backup: ' + lastBackupText() + '. Save the file to Google Drive to keep a copy off the phone.'; }
async function shareBackup(){
  const name = backupName(), json = backupJson();
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); markBackedUp(); setStatus('Backup shared.', 'ok'); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  downloadBackup();
}
function downloadBackup(){
  const blob = new Blob([backupJson()], { type: 'application/json' }); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = backupName(); document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 10000); markBackedUp(); setStatus('Backup file ready.', 'ok');
}
async function copyBackup(){
  const json = backupJson();
  try { await navigator.clipboard.writeText(json); markBackedUp(); setStatus('Backup copied to the clipboard.', 'ok'); }

async function restoreFromFile(file){

  if (!list) { setStatus('That file is not a Training Log backup.', 'warn'); return; }
  const have = new Set(state.workouts.map(w => w.id)); let added = 0;
  list.forEach(w => { if (w && w.id && w.date && !have.has(w.id)) { state.workouts.push(w); have.add(w.id); added++; } });
  sortWorkouts();

function sortWorkouts(){ state.workouts.sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.startedAt || 0) - (a.startedAt || 0)); }

/* ---------- derived numbers ---------- */
function countsByDate(){ const m = new Map(); state.workouts.forEach(w => m.set(w.date, (m.get(w.date) || 0) + 1)); return m; }
function thisWeekCount(){ const mon = dateStr(mondayOf(new Date())); return state.workouts.filter(w => w.date >= mon).length; }
function weekStreak(){
  const target = state.settings.weeklyTarget || 4; const counts = new Map();
  state.workouts.forEach(w => { const k = dateStr(mondayOf(parseDate(w.date))); counts.set(k, (counts.get(k) || 0) + 1); });
  let wk = mondayOf(new Date()), streak = 0;
  if ((counts.get(dateStr(wk)) || 0) < target) wk = addDays(wk, -7);
  while ((counts.get(dateStr(wk)) || 0) >= target && streak < 520) { streak++; wk = addDays(wk, -7); }

}
function last30(){ const cut = dateStr(addDays(new Date(), -29)); return state.workouts.filter(w => w.date >= cut); }
function exerciseNames(){
  const freq = new Map(), display = new Map();
  state.workouts.forEach(w => (w.exercises || []).forEach(e => { const k = norm(e.name); if (!k || e.kind === 'cardio') return; freq.set(k, (freq.get(k) || 0) + 1); if (!display.has(k)) display.set(k, e.name.trim()); }));
  return [...freq.entries()].sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).map(([k]) => ({ key: k, name: display.get(k) }));
}
function allNames(){ const s = new Set(STARTER_NAMES); state.workouts.forEach(w => (w.exercises || []).forEach(e => { if (e.name && e.name.trim()) s.add(e.name.trim()); })); return [...s].sort(); }
function exerciseSessions(key){
  const unit = state.settings.weightUnit; const out = [];
  state.workouts.forEach(w => {
    let best = 0, top = 0, vol = 0, sets = 0, hit = false; const wu = w.weightUnit || 'lb';
    (w.exercises || []).forEach(e => {
      if (norm(e.name) !== key || e.kind === 'cardio') return; hit = true;
      (e.sets || []).forEach(s => { const wt = convW(Number(s.weight) || 0, wu, unit), r = Number(s.reps) || 0; if (!wt && !r) return; sets++; if (wt > top) top = wt; vol += wt * r; const est = e1rm(wt, r); if (est > best) best = est; });
    });
    if (hit) out.push({ date: w.date, t: parseDate(w.date).getTime() + (w.startedAt ? new Date(w.startedAt).getHours() * 36e5 : 0), e1rm: best, top: top, vol: vol, sets: sets });
  });
  return out.sort((a, b) => a.t - b.t);
}
function workoutVolume(w){ const unit = state.settings.weightUnit, wu = w.weightUnit || 'lb'; let v = 0; (w.exercises || []).forEach(e => { if (e.kind === 'cardio') return; (e.sets || []).forEach(s => { v += convW(Number(s.weight) || 0, wu, unit) * (Number(s.reps) || 0); }); }); return v; }
function exSummary(e, w){
  const unit = state.settings.weightUnit, wu = w.weightUnit || 'lb';
  if (e.kind === 'cardio') { const d = convD(Number(e.distance) || 0, w.distUnit || 'mi', state.settings.distUnit); const parts = []; if (d) parts.push(fmtNum(d, 2) + ' ' + state.settings.distUnit); if (e.minutes) parts.push(fmtDur(e.minutes)); return parts.join(' in ') || 'logged'; }

  const show = s => { const wt = convW(Number(s.weight) || 0, wu, unit); return (s.reps || 0) + (wt ? ' × ' + fmtNum(wt, 1) : ''); };
  if (same) return sets.length + ' × ' + show(sets[0]) + (sets[0].weight ? ' ' + unit : '');

}

let timer = null;
function startTimer(startedAt){

  tick(); timer = setInterval(tick, 1000);
}
function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }

function renderHeatmap(c){
  const weeks = 16, counts = countsByDate(), today = new Date(), todayS = todayStr();
  const start = mondayOf(addDays(today, -7 * (weeks - 1)));
  let cells = '', months = '', lastMonth = -1;
  for (let w = 0; w < weeks; w++) {
    const mon = addDays(start, w * 7);
    if (mon.getMonth() !== lastMonth && (w === 0 || mon.getDate() <= 7)) { lastMonth = mon.getMonth(); months += '<span style="position:absolute;left:' + (w / weeks * 100) + '%">' + mon.toLocaleDateString(undefined, { month: 'short' }) + '</span>'; }
    for (let d = 0; d < 7; d++) {
      const day = addDays(mon, d), ds = dateStr(day), k = counts.get(ds) || 0;
      const future = ds > todayS;
      cells += '<div class="' + (k >= 3 ? 'h3' : k === 2 ? 'h2' : k === 1 ? 'h1' : '') + '" title="' + esc(day.toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })) + ' · ' + (k === 1 ? '1 workout' : k + ' workouts') + '"' + (future ? ' style="opacity:.35"' : '') + '></div>';
    }
  }
  c.innerHTML = '<div class="heat-wrap"><div></div><div class="heat-months">' + months + '</div><div class="heat-days"><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span><span>Sun</span></div><div class="heat" role="img" aria-label="Workouts per day over the last 16 weeks">' + cells + '</div></div>' +
    '<div class="heat-key">none <i></i><i class="h1"></i><i class="h2"></i><i class="h3"></i> 3+</div>';
}

    '<select id="progMetric" aria-label="Metric"><option value="e1rm"' + (state.progMetric === 'e1rm' ? ' selected' : '') + '>Est. 1RM</option><option value="top"' + (state.progMetric === 'top' ? ' selected' : '') + '>Top set</option><option value="vol"' + (state.progMetric === 'vol' ? ' selected' : '') + '>Volume</option></select></div>' +

  const recent = rows.slice(-6).reverse();

    '<table style="margin-top:8px"><thead><tr><th>Date</th><th class="num">Sets</th><th class="num">Top set (' + unit + ')</th><th class="num">Est. 1RM</th><th class="num">Volume</th></tr></thead><tbody>' +
    recent.map(r => '<tr><td>' + parseDate(r.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) + '</td><td class="num">' + r.sets + '</td><td class="num">' + fmtNum(r.top, 1) + '</td><td class="num">' + fmtNum(r.e1rm, 0) + '</td><td class="num">' + fmtNum(r.vol, 0) + '</td></tr>').join('') + '</tbody></table>';

function renderHr(c){

function renderVolume(c){

  const bars = []; for (let i = 0; i < weeks; i++) { const mon = addDays(start, i * 7), ms = dateStr(mon), me = dateStr(addDays(mon, 6)); const ws = state.workouts.filter(w => w.date >= ms && w.date <= me); bars.push({ label: mon.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }), value: ws.reduce((a, w) => a + workoutVolume(w), 0), extra: ws.length + (ws.length === 1 ? ' workout' : ' workouts') }); }

function renderHistory(){

  if (!state.workouts.length) { view.innerHTML = '<section><div class="empty">Nothing logged yet. Finished workouts are listed here, newest first.</div></section>'; return; }
  let html = '<section>', month = '';
  state.workouts.forEach(w => {
    const d = parseDate(w.date), mk = d.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    if (mk !== month) { month = mk; html += '<div class="month">' + esc(mk) + '</div>'; }
    const exs = w.exercises || [];
    const del = state.confirmDelete === w.id
      ? '<div class="confirm">Delete this workout for good? <button class="btn small danger" data-action="del-yes" data-id="' + esc(w.id) + '">Delete</button><button class="btn small" data-action="del-no">Keep</button></div>'
      : (state.canWrite ? '<button class="btn small" data-action="del" data-id="' + esc(w.id) + '">Delete</button>' : '');
    html += '<details class="hist"><summary><div class="d"><span>' + d.toLocaleDateString(undefined, { weekday: 'short' }) + '</span><b>' + d.getDate() + '</b></div>' +
      '<div class="sum"><div class="t">' + esc(w.type) + ' <span class="pill">' + fmtDur(w.durationMin) + '</span></div><div class="s">' + (exs.length ? esc(exs.map(e => e.name).filter(Boolean).join(', ')) : 'no exercises listed') + '</div></div>' +
      '<div class="meta">' + (w.avgHr ? w.avgHr + ' bpm' : '') + (w.rpe ? '<br>RPE ' + w.rpe : '') + '</div></summary>' +
      '<div class="hist-body"><ul>' + exs.map(e => '<li><b>' + esc(e.name) + '</b> · ' + esc(exSummary(e, w)) + '</li>').join('') + '</ul>' +
      (w.maxHr ? '<p class="hr-note">Max heart rate ' + w.maxHr + ' bpm' + (w.avgHr ? ', average ' + w.avgHr : '') + '</p>' : '') +
      (w.notes ? '<p class="note">' + esc(w.notes) + '</p>' : '') + del + '</div></details>';
  });
  view.innerHTML = html + '</section>';
}

/* ---------- charts ---------- */
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs){ const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }
function niceStep(range){ const raw = Math.max(range, 1e-9) / 5, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p; }
function niceScale(lo, hi, fromZero){
  if (!(hi > lo)) hi = lo + Math.max(Math.abs(lo) * 0.1, 1);
  const step = niceStep(Math.max(hi - lo, Math.abs(hi) * 0.08, 1));
  let min = fromZero ? 0 : Math.floor(lo / step) * step; if (!fromZero && hi - lo < step * 2 && min > lo - step * 0.5) min -= step;
  let max = Math.ceil(hi / step) * step; if (max - hi < step * 0.15) max += step;
  if (min < 0) min = 0;
  const n = Math.round((max - min) / step), ticks = []; for (let i = 0; i <= n; i++) ticks.push(min + i * step);
  return { min: min, max: max, step: step, ticks: ticks };
}
function lineChart(container, opts){
  const W = Math.max(280, container.clientWidth || 340), H = 220, m = { t: 18, r: 18, b: 28, l: 44 };
  const all = opts.series.reduce((a, s) => a.concat(s.points), []);
  if (!all.length) return;
  const ts = all.map(p => p.t); let t0 = Math.min.apply(null, ts), t1 = Math.max.apply(null, ts); if (t0 === t1) { t0 -= 864e5; t1 += 864e5; }
  const ys = all.map(p => p.y); const sc = niceScale(opts.yFrom0 ? 0 : Math.min.apply(null, ys), Math.max.apply(null, ys), !!opts.yFrom0); const yMin = sc.min, yMax = sc.max;
  const x = t => m.l + (t - t0) / (t1 - t0) * (W - m.l - m.r);
  const y = v => m.t + (1 - (v - yMin) / (yMax - yMin)) * (H - m.t - m.b);
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H, class: 'chart', role: 'img', 'aria-label': opts.series.map(s => s.name).join(' and ') + ' over time' });
  sc.ticks.forEach((v, i) => { svg.append(svgEl('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: i === 0 ? 'base' : 'grid' })); const tx = svgEl('text', { x: m.l - 6, y: y(v) + 4, class: 'tick', 'text-anchor': 'end' }); tx.textContent = opts.fmtY(v); svg.append(tx); });
  const uniq = [...new Set(ts)].sort((a, b) => a - b), nT = Math.min(4, uniq.length);
  for (let i = 0; i < nT; i++) { const t = nT === 1 ? uniq[0] : t0 + (t1 - t0) * i / (nT - 1); const tx = svgEl('text', { x: x(t), y: H - 8, class: 'tick', 'text-anchor': nT === 1 ? 'middle' : i === 0 ? 'start' : i === nT - 1 ? 'end' : 'middle' }); tx.textContent = new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); svg.append(tx); }
  opts.series.forEach(s => {
    const pts = s.points.slice().sort((a, b) => a.t - b.t);
    svg.append(svgEl('path', { d: pts.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p.y).toFixed(1)).join(' '), fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
    if (pts.length <= 40) pts.forEach(p => svg.append(svgEl('circle', { cx: x(p.t), cy: y(p.y), r: 3.5, fill: s.color, stroke: 'var(--surface)', 'stroke-width': 1.5 })));
    const last = pts[pts.length - 1]; svg.append(svgEl('circle', { cx: x(last.t), cy: y(last.y), r: 5, fill: s.color, stroke: 'var(--surface)', 'stroke-width': 2 }));
  });
  const cross = svgEl('line', { class: 'cross', y1: m.t, y2: H - m.b, visibility: 'hidden' }); svg.append(cross);
  const wrap = document.createElement('div'); wrap.className = 'chart-wrap'; wrap.append(svg);
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; wrap.append(tip);
  function move(ev){
    const r = svg.getBoundingClientRect(); const cx = (ev.touches ? ev.touches[0].clientX : ev.clientX) - r.left; const sx = cx * W / r.width;
    let best = uniq[0], bd = Infinity; uniq.forEach(t => { const d = Math.abs(x(t) - sx); if (d < bd) { bd = d; best = t; } });
    cross.setAttribute('x1', x(best)); cross.setAttribute('x2', x(best)); cross.setAttribute('visibility', 'visible');
    tip.innerHTML = '<div class="tip-h">' + new Date(best).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + '</div>' +
      opts.series.map(s => { const p = s.points.find(p => p.t === best); return p ? '<div class="tip-row"><span><i class="sw" style="background:' + s.color + '"></i> ' + esc(s.name) + '</span><b>' + esc(p.label || opts.fmtY(p.y)) + '</b></div>' : ''; }).join('');
    tip.hidden = false; tip.style.left = Math.min(Math.max(x(best) * r.width / W, 90), r.width - 90) + 'px';
  }
  const leave = () => { tip.hidden = true; cross.setAttribute('visibility', 'hidden'); };
  svg.addEventListener('mousemove', move); svg.addEventListener('mouseleave', leave);
  svg.addEventListener('touchstart', move, { passive: true }); svg.addEventListener('touchmove', move, { passive: true }); svg.addEventListener('touchend', leave);
  container.append(wrap);
}
function barChart(container, opts){
  const W = Math.max(280, container.clientWidth || 340), H = 200, m = { t: 14, r: 8, b: 28, l: 44 }, bars = opts.bars, n = bars.length;
  const sc = niceScale(0, Math.max.apply(null, bars.map(b => b.value)), true), yMax = sc.max;
  const y = v => m.t + (1 - v / yMax) * (H - m.t - m.b), bw = (W - m.l - m.r) / n, gap = Math.max(1, bw * 0.15);
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: H, class: 'chart', role: 'img', 'aria-label': 'Weekly volume, last ' + n + ' weeks' });
  sc.ticks.forEach((v, i) => { svg.append(svgEl('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), class: i === 0 ? 'base' : 'grid' })); const tx = svgEl('text', { x: m.l - 6, y: y(v) + 4, class: 'tick', 'text-anchor': 'end' }); tx.textContent = opts.fmtY(v); svg.append(tx); });
  const wrap = document.createElement('div'); wrap.className = 'chart-wrap';
  const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true;
  bars.forEach((b, i) => {
    const x0 = m.l + i * bw + gap, w = bw - 2 * gap, y0 = y(b.value), base = y(0), r = Math.min(4, w / 2);
    if (b.value > 0) { const top = Math.min(y0, base - r); svg.append(svgEl('path', { d: 'M' + x0 + ' ' + base + ' L' + x0 + ' ' + (top + r) + ' Q' + x0 + ' ' + top + ' ' + (x0 + r) + ' ' + top + ' L' + (x0 + w - r) + ' ' + top + ' Q' + (x0 + w) + ' ' + top + ' ' + (x0 + w) + ' ' + (top + r) + ' L' + (x0 + w) + ' ' + base + ' Z', fill: 'var(--s1)' })); }
    if (i % 2 === (n - 1) % 2) { const tx = svgEl('text', { x: x0 + w / 2, y: H - 8, class: 'tick', 'text-anchor': 'middle' }); tx.textContent = b.label; svg.append(tx); }
    const hit = svgEl('rect', { x: m.l + i * bw, y: m.t, width: bw, height: H - m.t - m.b, fill: 'transparent' });
    const show = () => { const rr = svg.getBoundingClientRect(); tip.innerHTML = '<div class="tip-h">Week of ' + esc(b.label) + '</div><div class="tip-row"><span>' + esc(b.extra) + '</span><b>' + esc(opts.fmtV(b.value)) + '</b></div>'; tip.hidden = false; tip.style.left = Math.min(Math.max((x0 + w / 2) * rr.width / W, 90), rr.width - 90) + 'px'; };
    hit.addEventListener('mouseenter', show); hit.addEventListener('touchstart', show, { passive: true });
    svg.append(hit);
  });
  svg.addEventListener('mouseleave', () => { tip.hidden = true; }); svg.addEventListener('touchend', () => { tip.hidden = true; });
  wrap.append(svg, tip); container.append(wrap);
}

/* ---------- actions ---------- */
function activeExercise(i){ return state.active && state.active.exercises && state.active.exercises[i]; }
function numOrNull(v){ if (v === '' || v == null) return null; const n = Number(v); return isNaN(n) ? null : n; }
view.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-action]'); if (!b || !view.contains(b)) return;
  const act = b.dataset.action, i = Number(b.dataset.ex), j = Number(b.dataset.set);
  if (!state.canWrite && act !== 'del-no' && act !== 'discard-no') { setStatus('This log is read-only for you.', 'warn'); return; }
  if (act === 'open-settings') { openSettings(true); window.scrollTo({ top: 0 }); return; }
  if (act === 'start') { state.active = { startedAt: Date.now(), type: 'Strength', exercises: [] }; render(); persistActive(); }
  else if (act === 'manual') { state.active = { manual: true, startedAt: Date.now(), date: todayStr(), durationMin: 45, type: 'Strength', exercises: [] }; render(); persistActive(); }
  else if (act === 'add-ex') { state.active.exercises.push({ name: '', kind: 'lift', sets: [{ reps: null, weight: null }] }); render(); persistActive(); const inp = $('#f-name-' + (state.active.exercises.length - 1)); if (inp) inp.focus(); }
  else if (act === 'rm-ex') { state.active.exercises.splice(i, 1); render(); persistActive(); }
  else if (act === 'kind') { const e = activeExercise(i); if (!e) return; e.kind = b.dataset.kind; if (e.kind === 'lift' && !(e.sets && e.sets.length)) e.sets = [{ reps: null, weight: null }]; render(); persistActive(); }
  else if (act === 'add-set') { const e = activeExercise(i); if (!e) return; e.sets = e.sets || []; const prev = e.sets[e.sets.length - 1]; e.sets.push({ reps: prev ? prev.reps : null, weight: prev ? prev.weight : null }); render(); persistActive(); const inp = $('#f-reps-' + i + '-' + (e.sets.length - 1)); if (inp) inp.focus(); }
  else if (act === 'rm-set') { const e = activeExercise(i); if (!e) return; e.sets.splice(j, 1); render(); persistActive(); }
  else if (act === 'discard') { state.confirmDiscard = true; render(); }
  else if (act === 'discard-no') { state.confirmDiscard = false; render(); }
  else if (act === 'discard-yes') { state.active = null; state.confirmDiscard = false; render(); await persistActive(); setStatus('Session discarded.', 'ok'); }
  else if (act === 'finish') { await finishWorkout(); }
  else if (act === 'del') { state.confirmDelete = b.dataset.id; render(); }
  else if (act === 'del-no') { state.confirmDelete = null; render(); }
  else if (act === 'del-yes') { const id = b.dataset.id; state.confirmDelete = null; try { await store.deleteWorkout(id); setStatus('Workout deleted.', 'ok'); } catch (e) { setStatus('Could not delete: ' + (e && e.message || e), 'warn'); } render(); }
});
view.addEventListener('change', ev => {
  const t = ev.target;
  if (t.id === 'progEx') { state.progEx = t.value; lsSet('progEx', t.value); render(); return; }
  if (t.id === 'progMetric') { state.progMetric = t.value; lsSet('progMetric', t.value); render(); return; }
  const f = t.dataset.field; if (!f || !state.active) return;
  const a = state.active, i = Number(t.dataset.ex), j = Number(t.dataset.set);
  if (f === 'type') a.type = t.value;
  else if (f === 'date') { if (t.value) a.date = t.value; }
  else if (f === 'durationMin') a.durationMin = numOrNull(t.value);
  else if (f === 'avgHr') a.avgHr = numOrNull(t.value);
  else if (f === 'maxHr') a.maxHr = numOrNull(t.value);
  else if (f === 'rpe') a.rpe = numOrNull(t.value);
  else if (f === 'notes') a.notes = t.value;
  else if (f === 'ex-name') { const e = activeExercise(i); if (e) e.name = t.value; }
  else if (f === 'ex-dist') { const e = activeExercise(i); if (e) e.distance = numOrNull(t.value); }
  else if (f === 'ex-min') { const e = activeExercise(i); if (e) e.minutes = numOrNull(t.value); }
  else if (f === 'set-reps') { const e = activeExercise(i); if (e && e.sets[j]) e.sets[j].reps = numOrNull(t.value); }
  else if (f === 'set-weight') { const e = activeExercise(i); if (e && e.sets[j]) e.sets[j].weight = numOrNull(t.value); }
  lastKey = JSON.stringify([state.tab, state.loaded, state.backend, state.canWrite, state.settings, state.active, state.workouts.length, state.workouts[0] && state.workouts[0].id, lsGet('lastBackup', null), state.progEx, state.progMetric, state.confirmDelete, state.confirmDiscard]);
  persistActive();
});
async function finishWorkout(){
  const a = state.active; if (!a) return;
  const exercises = (a.exercises || []).map(e => {
    const out = { name: String(e.name || '').trim(), kind: e.kind === 'cardio' ? 'cardio' : 'lift' };
    if (out.kind === 'cardio') { out.distance = Number(e.distance) || 0; out.minutes = Number(e.minutes) || 0; }
    else out.sets = (e.sets || []).filter(s => s.reps || s.weight).map(s => ({ reps: Number(s.reps) || 0, weight: Number(s.weight) || 0 }));
    return out;
  }).filter(e => e.name);
  const durationMin = a.manual ? (Number(a.durationMin) || 0) : Math.max(1, Math.round((Date.now() - a.startedAt) / 60000));
  if (!exercises.length && !durationMin) { setStatus('Add at least one exercise or a duration before saving.', 'warn'); return; }
  if (a.manual && (!a.date || a.date > todayStr())) { setStatus('Pick a date that is today or earlier.', 'warn'); return; }
  const w = { id: uid(), date: a.manual ? a.date : dateStr(new Date(a.startedAt)), startedAt: a.startedAt, durationMin: durationMin, type: a.type || 'Strength', exercises: exercises,
    avgHr: Number(a.avgHr) || null, maxHr: Number(a.maxHr) || null, rpe: Number(a.rpe) || null, notes: String(a.notes || '').trim(), weightUnit: state.settings.weightUnit, distUnit: state.settings.distUnit, createdAt: Date.now() };
  try { await store.saveWorkout(w); } catch (e) { setStatus('Could not save the workout: ' + (e && e.message || e), 'warn'); return; }
  state.active = null; state.confirmDiscard = false; render(); await persistActive();
  setStatus('Workout saved: ' + exercises.length + (exercises.length === 1 ? ' exercise, ' : ' exercises, ') + fmtDur(durationMin) + '.', 'ok');
}

/* ---------- tabs & settings ---------- */
$('#tabs').addEventListener('click', ev => { const b = ev.target.closest('button[data-tab]'); if (!b) return; state.tab = b.dataset.tab; lsSet('tab', state.tab); render(); window.scrollTo({ top: 0 }); });
function openSettings(open){ const p = $('#settingsPanel'); p.hidden = !open; $('#settingsBtn').setAttribute('aria-expanded', String(open)); if (open) { $('#setTarget').value = state.settings.weeklyTarget; $('#setWeight').value = state.settings.weightUnit; $('#setDist').value = state.settings.distUnit; renderBackupInfo(); } }
$('#settingsBtn').addEventListener('click', () => openSettings($('#settingsPanel').hidden));
$('#shareBackup').addEventListener('click', shareBackup);
$('#downloadBackup').addEventListener('click', downloadBackup);
$('#copyBackup').addEventListener('click', copyBackup);
$('#restoreBtn').addEventListener('click', () => $('#restoreFile').click());
$('#restoreFile').addEventListener('change', ev => { const f = ev.target.files && ev.target.files[0]; if (f) restoreFromFile(f); ev.target.value = ''; });
if ('serviceWorker' in navigator) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); }); }
$('#closeSettings').addEventListener('click', () => { $('#settingsPanel').hidden = true; $('#settingsBtn').setAttribute('aria-expanded', 'false'); });
$('#saveSettings').addEventListener('click', async () => {
  const s = { weeklyTarget: Math.min(14, Math.max(1, Math.round(Number($('#setTarget').value) || 4))), weightUnit: $('#setWeight').value === 'kg' ? 'kg' : 'lb', distUnit: $('#setDist').value === 'km' ? 'km' : 'mi' };
  try { await store.saveSettings(s); $('#settingsPanel').hidden = true; $('#settingsBtn').setAttribute('aria-expanded', 'false'); setStatus('Settings saved.', 'ok'); } catch (e) { setStatus('Could not save settings: ' + (e && e.message || e), 'warn'); }
});
let resizeT = null; window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (state.tab === 'progress') { lastKey = ''; render(); } }, 150); });

/* ---------- boot ---------- */
const hash = (location.hash || '').slice(1); const savedTab = lsGet('tab', 'today');
state.tab = ['today', 'progress', 'history'].includes(hash) ? hash : (['today', 'progress', 'history'].includes(savedTab) ? savedTab : 'today');
state.progEx = lsGet('progEx', null); state.progMetric = ['e1rm', 'top', 'vol'].includes(lsGet('progMetric', 'e1rm')) ? lsGet('progMetric', 'e1rm') : 'e1rm';
render();
store.init();
})();
</script>
