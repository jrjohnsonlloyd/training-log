<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Training Log UI smoke tests</title>
<style>
body{font:13px/1.45 system-ui,sans-serif;margin:0;color:#111;background:#fff}
#app{display:block;border:0;width:390px;height:844px}
#status{margin:6px 8px}
pre{white-space:pre-wrap;overflow-wrap:anywhere;margin:6px 8px}
</style>
</head>
<body>
<div id="stage"></div>
<p id="status">starting</p>
<pre id="result"></pre>
<script>
/*
  UI smoke tests for Training Log. Run with:  python tests/run_ui_smoke.py [--suite NAME] [--db-file PATH]

  How it works: this page is served from the same origin as the app. It fills localStorage with data in the
  shape a real phone already holds, loads ../index.html in a 390 x 844 iframe, drives the app through its DOM
  and writes the outcome as JSON, after the marker word RESULT, into the pre element with id "result".
  Headless Chrome prints the final DOM and run_ui_smoke.py reads the JSON back.

  Adding a suite: write "async function suiteSomething(){ ... }" below using the shared helpers, add a row to
  SUITES at the bottom, and run  python tests/run_ui_smoke.py --suite something.
  Each "await step(name, fn)" records one check {name, ok, detail}: ok when fn returns (its return value is the
  detail), failed when it throws (use expect(condition, message)). A step never stops the ones after it.

  Rules for every suite: no real network, and never seed "tl.sync". "Find food", Enter with fewer than three local
  matches, a barcode that is not in the served bundle and "Search brands online" all go online, so a suite may only
  use them while stubFetch() is answering for the two lookup services (the "v2" suite does that once).

  Suites: "baseline" runs against the repository's own food-db.json (the old version 1 bundle, so it also proves that
  old bundles still load). "v2" needs a version 2 bundle served as /food-db.json; run_ui_smoke.py --suite v2 builds one
  from the fixtures with scripts/import_foods.py, or serves tests/fixtures/food-db.v2.sample.json (see --bundle).
  The v2 checks only rely on the anchor rows that both bundles contain; a check that needs something only one of them
  has (an "alias" list, the three same-named sample rows) reports XFAIL "not run" on the other.
  "ranking" checks the order of search results on a real bundle: run it with --db-file PATH. With a bundle of fewer
  than 20,000 rows it does nothing and reports that it was skipped (the runner then exits with 0).

  What the suites read from the app's page, besides ids and data-action: #food-res carries data-q (the text the list
  answers), every result row (.food-item) carries data-src (fav, recent, lib, curated, usda, off, online), and a row whose
  name and brand another listed row shares shows its calories per 100 g in a span with class fr-per.
*/
(function(){
'use strict';
const params = new URLSearchParams(location.search);
const suiteName = params.get('suite') || 'baseline';
const APP_URL = '../index.html';
const checks = [];
const appErrors = [];
let frame = null;
let skipped = '';   /* set by a suite that cannot say anything about what is being served: the runner prints the reason and exits with 0 */

/* ---------- reporting ---------- */
function publish(done){
  const out = { suite: suiteName, done: !!done, checks: checks }; if (skipped) out.skipped = skipped;
  document.getElementById('result').textContent = 'RESULT ' + JSON.stringify(out);
  document.getElementById('status').textContent = (done ? 'finished: ' : 'running: ') + (skipped ? 'skipped, ' + skipped : checks.filter(c => c.ok).length + ' of ' + checks.length + ' checks passed') + ' (suite ' + suiteName + ')';
}
/* opts.xfail = true marks a failure that is expected because of a known bug in the app, or a check that cannot run on what is being served; the runner prints XFAIL and does not count it.
   opts.show = true makes the runner print the detail of a passing check even without --verbose (for measured rates). */
function check(name, ok, detail, opts){
  const c = { name: String(name), ok: !!ok, detail: detail == null ? '' : String(detail) };
  if (opts && opts.xfail) c.xfail = true;
  if (opts && opts.show) c.show = true;
  checks.push(c); publish(false); return c.ok;
}
const notRun = (name, why) => check(name, false, 'not run: ' + why, { xfail: true });
function expect(cond, msg){ if (!cond) throw new Error(msg || 'expectation failed'); }
async function step(name, fn, opts){
  try { const d = await fn(); check(name, true, d, opts); return true; }
  catch (e) { check(name, false, e && e.message || String(e), opts); return false; }
}

/* ---------- shared helpers: time ---------- */
const wait = ms => new Promise(res => setTimeout(res, ms));
/* Polls fn every 25 ms until it returns something truthy, and returns that; throws after about ms milliseconds. */
async function waitFor(fn, ms, label){
  const tries = Math.max(1, Math.ceil((ms == null ? 4000 : ms) / 25));
  for (let i = 0; i <= tries; i++) {
    let v = null; try { v = fn(); } catch (e) { v = null; }
    if (v) return v;
    await wait(25);
  }
  throw new Error('timed out waiting for ' + (label || 'a condition'));
}

/* ---------- shared helpers: the app's DOM (inside the iframe) ---------- */
const win = () => frame.contentWindow;
const doc = () => frame.contentDocument;
const q = sel => doc().querySelector(sel);
const qa = sel => Array.from(doc().querySelectorAll(sel));
const txt = el => el ? el.textContent.replace(/\s+/g, ' ').trim() : '';
const clean = s => String(s == null ? '' : s).replace(/\s+/g, ' ').trim();   /* a stored text as txt() would read it back from the page */
/* Whole number shown on screen, whatever the thousands separator: "1,310 kcal so far" -> 1310. Not for decimals. */
const num = s => { const d = String(s == null ? '' : s).replace(/[^0-9]/g, ''); return d ? Number(d) : NaN; };
const visible = el => !!el && el.getClientRects().length > 0;
/* Stricter: also false inside a folded <details>, whose content keeps its boxes but is not drawn. */
const shown = el => visible(el) && (typeof el.checkVisibility !== 'function' || el.checkVisibility());
function fire(el, type){ el.dispatchEvent(new (win().Event)(type, { bubbles: true })); }
/* Types into a text field the way the keyboard does: sets .value and sends a bubbling input event. */
function type(sel, text){ const el = q(sel); expect(el, 'no element ' + sel); el.focus(); el.value = text; fire(el, 'input'); return el; }
/* For number fields and other inputs that the app reads on change. */
function setValue(sel, value){ const el = q(sel); expect(el, 'no element ' + sel); el.value = String(value); fire(el, 'input'); fire(el, 'change'); return el; }
function optionTexts(sel){ const el = q(sel); return el ? Array.from(el.options).map(txt) : []; }
function selectOption(sel, label){
  const el = q(sel); expect(el, 'no element ' + sel);
  const o = Array.from(el.options).find(x => txt(x) === label);
  expect(o, 'no option "' + label + '" in ' + sel + ' (it has: ' + (optionTexts(sel).join(' | ') || 'nothing') + ')');
  el.value = o.value; fire(el, 'change'); return el;
}
function actionSel(action, attrs){ let s = '[data-action="' + action + '"]'; Object.keys(attrs || {}).forEach(k => { s += '[data-' + k + '="' + attrs[k] + '"]'; }); return s; }
/* Clicks the app button with that data-action, optionally narrowed by data attributes: click('food-edit', { id: 'abc' }). */
function click(action, attrs){ const s = actionSel(action, attrs), el = q(s); expect(el, 'no button ' + s); expect(!el.disabled, 'button is disabled: ' + s); el.click(); return el; }
function clickSel(sel){ const el = q(sel); expect(el, 'no element ' + sel); el.click(); return el; }

/* ---------- shared helpers: stored data ---------- */
function readKey(k){ const v = localStorage.getItem('tl.' + k); return v == null ? null : JSON.parse(v); }
function readStore(){ const fd = readKey('food') || {}; return { entries: Array.isArray(fd.entries) ? fd.entries : [], saved: Array.isArray(fd.saved) ? fd.saved : [] }; }
function newEntries(knownIds){ return readStore().entries.filter(e => !knownIds.has(e.id)); }
function storeDayTotal(date){ return readStore().entries.filter(e => e.date === date && e.status !== 'pending').reduce((s, e) => s + (Number(e.kcal) || 0), 0); }
const copy = o => JSON.parse(JSON.stringify(o));
function same(a, b){
  if (a === b) return true;
  if (a == null || b == null || typeof a !== 'object' || typeof b !== 'object' || Array.isArray(a) !== Array.isArray(b)) return false;
  const ka = Object.keys(a), kb = Object.keys(b);
  return ka.length === kb.length && ka.every(k => Object.prototype.hasOwnProperty.call(b, k) && same(a[k], b[k]));
}
function diffKeys(a, b){
  const keys = Array.from(new Set(Object.keys(a || {}).concat(Object.keys(b || {}))));
  return keys.filter(k => !same((a || {})[k], (b || {})[k])).map(k => k + ' ' + JSON.stringify((a || {})[k]) + ' -> ' + JSON.stringify((b || {})[k])).join(', ');
}
/* SAFETY: this page wipes the app's stored data to seed test data. It shares its storage with the app when both are served from the same address, so it must never run anywhere but a local test server. */
function isLocalTestHost(){ return ['127.0.0.1', 'localhost', '[::1]'].includes(location.hostname); }
/* Clears localStorage and writes the given keys as the app stores them (JSON under "tl." + key). */
function seedStorage(data){
  if (!isLocalTestHost()) throw new Error('refusing to clear stored data: this test page only runs on a local test server');
  localStorage.clear();
  Object.keys(data).forEach(k => localStorage.setItem('tl.' + k, JSON.stringify(data[k])));
}
async function loadJson(url){ const r = await fetch(url, { cache: 'no-store' }); expect(r.ok, url + ' answered ' + r.status); return r.json(); }

/* ---------- shared helpers: dates ---------- */
const pad = n => String(n).padStart(2, '0');
const dateStr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
function dayOffset(n){ const d = new Date(); d.setDate(d.getDate() + n); return d; }
const round1 = v => Math.round((Number(v) || 0) * 10) / 10;

/* ---------- shared helpers: the app's screens ---------- */
function onAppError(ev){ appErrors.push('error: ' + (ev && ev.message || 'unknown') + (ev && ev.lineno ? ' (line ' + ev.lineno + ')' : '')); }
function onAppRejection(ev){ const r = ev && ev.reason; appErrors.push('unhandled promise rejection: ' + (r && r.message || r)); }
/* Safe to call many times: the same listener is only ever registered once per window. */
function hookErrors(){
  let w = null; try { w = frame && frame.contentWindow; } catch (e) { return; }
  if (!w) return;
  w.addEventListener('error', onAppError); w.addEventListener('unhandledrejection', onAppRejection);
}
/* Loads the app in a 390 x 844 iframe on the given tab and waits for readySel (default: the food form). Seed localStorage first. */
async function openApp(hash, readySel){
  const stage = document.getElementById('stage'); stage.textContent = '';
  frame = document.createElement('iframe'); frame.id = 'app'; frame.title = 'Training Log under test';
  frame.setAttribute('width', '390'); frame.setAttribute('height', '844');
  stage.appendChild(frame);
  hookErrors(); frame.addEventListener('load', hookErrors);
  const poll = setInterval(hookErrors, 4);
  frame.src = APP_URL + '#' + (hash || 'food');
  const sel = readySel || '#ff-name';
  try { await waitFor(() => { const d = frame.contentDocument; return d && d.querySelector(sel); }, 15000, sel + ' to appear in the app'); }
  finally { clearInterval(poll); hookErrors(); }
}
/* Rows of the live search results under the food field. cat is the muted label under the name: the brand, else the display group (a restaurant, "Home dish", a USDA group), or "Favourite" / "Recent" for your own foods.
   tag is "Favourite" or "Recent" on your own foods and empty otherwise. thumb is the picture address the row carries (null when the food has none), dcat its category, img the picture element while it is in the page, icon the category icon drawn under it.
   src is where the row comes from (data-src: fav, recent, lib, curated, usda, off, online); per is "N kcal/100 g" on a row that shares its name and brand with another listed row, else empty. */
function resultRows(){
  return qa('#food-res .food-item').map((it, i) => {
    const th = it.querySelector('.fthumb');
    return { i: i, el: it, name: txt(it.querySelector('.pickbtn b')), cat: txt(it.querySelector('.pickbtn .fr-brand') || it.querySelector('.pickbtn .pill')), tag: txt(it.querySelector('.pickbtn .pill')), sub: txt(it.querySelector('.pickbtn .s')), kcal: num(txt(it.querySelector('.k'))),
      src: it.getAttribute('data-src') || '', per: txt(it.querySelector('.pickbtn .fr-per')),
      thumbEl: th, thumb: th ? th.getAttribute('data-thumb') : null, dcat: th ? th.getAttribute('data-cat') : null, img: th ? th.querySelector('img') : null, icon: th ? th.querySelector('svg') : null };
  });
}
/* Types text and returns what the list shows once the app has answered (it waits 130 ms after the last key): the rows, or none when the list is hidden.
   The list says in data-q which text it answers, so the list of an earlier query is never read by mistake. For many queries in a row; search() above is for one query with a condition. */
async function typed(text){
  type('#ff-name', text); await wait(170);
  const box = q('#food-res'); if (!visible(box)) return [];
  expect(box.getAttribute('data-q') === text.trim(), 'the list answers "' + box.getAttribute('data-q') + '" after "' + text + '" was typed');
  return resultRows();
}
/* Types a query into the food field and waits until the results list is showing and until(rows) is true (default: at least one row). Local search only. */
async function search(text, until, ms){
  const old = q('#food-res'), before = visible(old) ? old.innerHTML : '';
  type('#ff-name', text);
  let n = 0;
  try {
    return await waitFor(() => {
      if (++n % 40 === 0) type('#ff-name', text);   /* typed again about once a second in case a food list was still loading */
      const box = q('#food-res'); if (!visible(box)) return null;
      if (n < 16 && box.innerHTML === before) return null;   /* still the list of the query before: allow 400 ms for the redraw */
      const rows = resultRows();
      return (until ? until(rows) : rows.length > 0) ? rows : null;
    }, ms || 6000);
  } catch (e) {
    const rows = resultRows(), box = q('#food-res');
    throw new Error('typing "' + text + '" did not give the expected results; the list ' + (visible(box) ? 'shows: ' + (rows.map(r => r.name).slice(0, 5).join(' | ') || txt(box).slice(0, 160)) : 'is hidden'));
  }
}
/* One entry in the day's log, found by its stored id. */
function logRow(id){
  const b = q(actionSel('food-edit', { id: id })); if (!b) return null;
  const it = b.closest('.food-item'); if (!it) return null;
  const k = it.querySelector('.k');
  return { el: it, name: txt(it.querySelector('.n > b')), kcal: num(txt(k)), pending: /pending/i.test(txt(k)), text: txt(it) };
}
/* The big calorie figure at the top of the Food tab. */
function dayTotal(){ return num(txt(q('.hero h2'))); }

/* ---------- seed data: what a phone holds from the version before the food-database change ---------- */
function baselineData(){
  const now = new Date(), yd = dayOffset(-1), today = dateStr(now), yesterday = dateStr(yd);
  const at = (d, h, m) => new Date(d.getFullYear(), d.getMonth(), d.getDate(), h, m || 0).getTime();
  return {
    today: today, yesterday: yesterday,
    store: {
      food: {
        entries: [
          { id: 'seedtoday1', date: today, at: at(now, 7, 40), name: 'Smoke test oatmeal bowl', qty: 1, serving: '', kcal: 310, protein: 11.5, carbs: 52, fat: 6.2, meal: 'Breakfast', source: 'manual' },
          { id: 'seedtoday2', date: today, at: at(now, 12, 15), name: 'Smoke test tapsilog plate', qty: 2, serving: '1 plate (300 g)', kcal: 860, protein: 48.4, carbs: 96, fat: 30.6, meal: 'Lunch', source: 'library' },
          { id: 'seedpending', date: today, at: at(now, 13, 5), name: 'Smoke test mystery stew', note: 'Smoke test mystery stew', qty: 1, serving: '', kcal: null, protein: null, carbs: null, fat: null, meal: 'Lunch', source: 'claude', status: 'pending' },
          { id: 'seedvictim', date: today, at: at(now, 15, 30), name: 'Smoke test cracker pack', qty: 1, serving: '1 pack (30 g)', kcal: 140, protein: 2, carbs: 20, fat: 6, meal: 'Snack', source: 'packaged' },
          { id: 'seedyday1', date: yesterday, at: at(yd, 19, 0), name: 'Smoke test sinigang dinner', qty: 1.5, serving: '1 bowl (350 g)', kcal: 525, protein: 39, carbs: 21, fat: 31.5, meal: 'Dinner', source: 'recent' },
          { id: 'seedyday2', date: yesterday, at: at(yd, 8, 10), name: 'Smoke test estimated pandesal', note: 'two pandesal with butter', qty: 1, serving: '2 pieces', kcal: 290, protein: 7, carbs: 44, fat: 9.5, meal: 'Breakfast', source: 'claude', status: 'estimated', est: { confidence: 'medium', notes: 'Typical bakery size assumed.', at: '2026-11-20T04:00:00Z' } }
        ],
        saved: [
          { id: 'seedfav1', name: 'Smoke test protein shake', serving: '1 scoop with water', kcal: 120, protein: 24, carbs: 3, fat: 1.5, uses: 5, lastUsed: at(yd, 9, 0) },
          { id: 'seedfav2', name: 'Smoke test boiled egg', serving: '1 large', kcal: 78, protein: 6.3, carbs: 0.6, fat: 5.3, uses: 2, lastUsed: at(yd, 7, 0) }
        ]
      },
      settings: { kcalTarget: 2100, proteinTarget: 120, weeklyTarget: 5, restSec: 120, weightUnit: 'kg', distUnit: 'km', theme: 'light' },
      workouts: [
        { id: 'seedworkout1', date: yesterday, startedAt: at(yd, 17, 0), durationMin: 45, type: 'Strength', exercises: [{ name: 'Squat', kind: 'lift', sets: [{ reps: 5, weight: 100 }, { reps: 5, weight: 100 }] }, { name: 'Run', kind: 'cardio', distance: 3, minutes: 18 }], avgHr: 128, maxHr: 161, rpe: 7, notes: 'Smoke test workout', weightUnit: 'kg', distUnit: 'km', prs: [], createdAt: at(yd, 17, 50) }
      ],
      tab: 'food'
    }
  };
}

/* ---------- suite: baseline (everything the app did before the food-database change) ---------- */
async function suiteBaseline(){
  const seed = baselineData(); seedStorage(seed.store);
  const kept = copy(seed.store);   /* what was seeded, for the data-preservation check at the end */
  const entries = seed.store.food.entries, favs = seed.store.food.saved;
  const E = id => entries.find(e => e.id === id);
  const todays = entries.filter(e => e.date === seed.today), counted = todays.filter(e => e.status !== 'pending'), ydays = entries.filter(e => e.date === seed.yesterday);
  const sumKcal = list => list.reduce((s, e) => s + (e.status === 'pending' ? 0 : Number(e.kcal) || 0), 0);
  const deleted = [];   /* ids of seeded entries this suite removes on purpose */

  const booted = await step('app boots on the Food tab without throwing', async () => {
    await openApp('food');
    await wait(2500);   /* food-library.json loads at start, food-db.json 1.5 s later */
    expect(q('#ff-name'), 'the food form is gone after loading');
    const tab = q('#tabs button[aria-selected="true"]'); expect(tab && tab.dataset.tab === 'food', 'the Food tab is not the selected tab');
    expect(!appErrors.length, appErrors.join(' | '));
    return 'food form rendered, no error events';
  });
  if (!booted) { check('remaining checks were skipped because the app did not boot', false, ''); return; }

  await step('seeded entries for today are listed with names and calories', async () => {
    counted.forEach(e => {
      const r = logRow(e.id); expect(r, 'not listed: ' + e.name);
      expect(r.name === e.name, 'entry ' + e.id + ' shows the name "' + r.name + '"');
      expect(r.kcal === Math.round(e.kcal), e.name + ' shows ' + r.kcal + ' kcal, stored ' + e.kcal);
    });
    const two = E('seedtoday2'), r2 = logRow(two.id);
    expect(r2.text.indexOf('2 × ' + two.serving) >= 0, 'the 2-serving entry does not show its servings: ' + r2.text);
    ydays.forEach(e => expect(!logRow(e.id), 'an entry from yesterday is listed under today: ' + e.name));
    return counted.length + ' entries listed';
  });

  await step('day total equals the sum of today\'s counted entries', async () => {
    const want = Math.round(sumKcal(todays)), got = dayTotal();
    expect(got === want, 'the header shows ' + got + ' kcal, the entries add up to ' + want);
    return got + ' kcal';
  });

  await step('pending Ask Claude entry shows as pending and is not counted', async () => {
    const p = E('seedpending'), r = logRow(p.id); expect(r, 'the pending entry is not listed');
    expect(r.name === p.name, 'the pending entry shows the name "' + r.name + '"');
    expect(r.pending, 'no Pending marker: ' + r.text);
    expect(/waiting for/i.test(r.text), 'no waiting note: ' + r.text);
    const lede = txt(q('.hero .lede')); expect(/1 entry is waiting for an estimate/.test(lede), 'the summary does not mention the waiting entry: ' + lede);
    return r.text.slice(0, 80);
  });

  await step('favourites chips are present', async () => {
    favs.forEach(s => {
      const c = q(actionSel('food-quick', { id: s.id })); expect(c, 'no chip for the favourite ' + s.name);
      const t = txt(c); expect(t.indexOf(s.name) === 0 && num(t.slice(s.name.length)) === Math.round(s.kcal), 'the chip reads "' + t + '"');
    });
    return favs.length + ' chips';
  });

  await step('Recent chips are present', async () => {
    const chips = qa('[data-action="food-recent"]').map(txt); expect(chips.length > 0, 'no Recent chips');
    const favNames = new Set(favs.map(s => s.name.toLowerCase()));
    entries.forEach(e => {
      const t = chips.find(x => x.indexOf(e.name) === 0);
      if (e.status === 'pending') { expect(!t, 'a pending entry is offered as Recent: ' + t); return; }
      if (favNames.has(e.name.toLowerCase())) return;
      expect(t, 'no Recent chip for ' + e.name);
      expect(num(t.slice(e.name.length)) === Math.round(e.kcal), 'the chip reads "' + t + '", stored ' + e.kcal + ' kcal');
    });
    return chips.length + ' chips';
  });

  await step('typing "banana raw" lists "Banana, raw" first', async () => {
    const rows = await search('banana raw', r => r.length > 0 && r[0].name === 'Banana, raw');
    return rows.length + ' rows, first: ' + rows[0].name + ' (' + rows[0].cat + ')';
  });

  await step('typing "chickenjoy" lists Jollibee items from the curated library', async () => {
    const lib = await loadJson('../food-library.json');
    const rows = await search('chickenjoy', r => r.some(x => x.cat === 'Jollibee'));
    const jb = rows.filter(r => r.cat === 'Jollibee' && /chickenjoy/i.test(r.name));
    expect(jb.length >= 2, 'only ' + jb.length + ' Jollibee Chickenjoy rows: ' + rows.map(r => r.name).join(' | '));
    jb.forEach(r => {
      const it = (lib.items || []).find(x => x.name === r.name && x.cat === 'Jollibee'); expect(it, 'not in food-library.json: ' + r.name);
      expect(Math.round(it.kcal) === r.kcal, r.name + ' shows ' + r.kcal + ' kcal, the library says ' + it.kcal);
    });
    return jb.length + ' Jollibee rows, first: ' + rows[0].name;
  });

  await step('a two-character query lists results', async () => {
    const rows = await search('ri');
    expect(rows.some(r => /ri/i.test(r.name)), 'no row has "ri" in its name: ' + rows.map(r => r.name).slice(0, 5).join(' | '));
    return rows.length + ' rows, first: ' + rows[0].name;
  });

  await step('a one-character query hides the list', async () => {
    await search('ri');
    type('#ff-name', 'r');
    await waitFor(() => !visible(q('#food-res')), 3000, 'the list to hide after one character');
    return 'hidden';
  });

  await step('tapping the first result fills the form, shows serving sizes and hides the list', async () => {
    const rows = await search('banana raw', r => r.length > 0 && r[0].name === 'Banana, raw');
    click('food-use', { i: 0 });
    await waitFor(() => q('#ff-name') && q('#ff-name').value === rows[0].name, 3000, 'the food name in the form');
    expect(Number(q('#ff-kcal').value) > 0, 'no calories were filled in');
    expect(visible(q('#ff-pi-wrap')), 'the serving-size select is not showing');
    const opts = optionTexts('[data-ff="pi"]');
    expect(opts.indexOf('100 g') >= 0 && opts.indexOf('1 g') >= 0, 'serving sizes offered: ' + opts.join(' | '));
    expect(!visible(q('#food-res')), 'the results list is still showing');
    return 'serving sizes: ' + opts.join(' | ');
  });

  await step('choosing "1 g" and 150 servings logs 1.5 times the per-100 g calories', async () => {

/* Records every fetch() the app makes from now on. other() lists the ones that went to another host. */
function watchFetch(){
  const w = win(), orig = w.fetch, log = [];
  w.fetch = function(input){ log.push(String(input && input.url || input)); return orig.apply(w, arguments); };
  const host = u => { try { return new URL(u, w.location.href).host; } catch (e) { return '?'; } };
  return { log: log, stop: () => { w.fetch = orig; }, other: () => log.filter(u => host(u) !== w.location.host) };

/* Requests of any kind (not only fetch) that the browser made to the two online lookup services. */

/* Answers the app's calls to the two lookup services with canned JSON, so the online path runs without a network. Everything else passes through. */
function stubFetch(offBody, fdcBody){
  const w = win(), orig = w.fetch, calls = [];
  const reply = body => Promise.resolve(new w.Response(JSON.stringify(body), { status: 200, headers: { 'Content-Type': 'application/json' } }));
  w.fetch = function(input){
    const u = String(input && input.url || input);
    if (u.indexOf('//world.openfoodfacts.org/') >= 0) { calls.push(u); return reply(offBody); }
    if (u.indexOf('//api.nal.usda.gov/') >= 0) { calls.push(u); return reply(fdcBody); }
    return orig.apply(w, arguments);
  };
  return { calls: calls, stop: () => { w.fetch = orig; } };
}

/* ---------- helpers for reading the served bundle (the rules are written out again here on purpose: the tests state them, they do not borrow the app's code) ---------- */
const BARCODE_HEAD = 'Barcode match · saved in the app', ALIAS_HEAD = 'Same product, another pack · saved in the app';
function fieldIx(db){ const ix = {}; (db.fields || []).forEach((f, i) => { ix[f] = i; }); return ix; }
/* The search key of a text: lower case, accents folded, apostrophes and full stops dropped, "&" read as "and", anything that is not a letter or a digit is a space. */
function plain(s){
  let x = String(s == null ? '' : s).trim().toLowerCase();
  if (/[^\x00-\x7f]/.test(x)) x = x.normalize('NFKD').replace(/[̀-ͯ]/g, '').normalize('NFKC').toLowerCase();
  return x.replace(/['’`.]/g, '').replace(/&/g, ' and ').replace(/[^\p{L}\p{M}\p{N}]+/gu, ' ').trim();
}
/* Plural endings set aside, as the search does: eggs = egg, tomatoes = tomato; short words and words in -ss stay. */
const stemWord = w => w.length > 3 && /[^s]s$/.test(w) ? (/oes$/.test(w) ? w.slice(0, -2) : w.slice(0, -1)) : w;
const stemAll = s => String(s).split(' ').map(stemWord).join(' ');
/* One spelling per barcode: digits only, 8 to 14 of them, leading zeros dropped, padded to 13; in-store codes (2...) never match. */
function canonCode(raw){
  const d = String(raw == null ? '' : raw).replace(/[^0-9]/g, ''); if (d.length < 8 || d.length > 14) return null;
  const s = d.replace(/^0+/, ''); if (!s) return null;
  const c = s.padStart(13, '0');
  return c.charAt(0) === '2' || c.slice(0, 2) === '02' ? null : c;
}
/* What the "alias" list of a bundle promises. codes: barcodes of other packs that must find their row (code as typed, 13 digits; digits = how many the number in the file had).
   own: codes that are a row's own barcode and must keep finding that row. ignored: codes that must find nothing (no such row index, or an in-store code). */
function aliasPlan(db){
  const ix = fieldIx(db), items = db.items, mine = new Map(), codes = [], own = [], bad = [], seen = new Set();
  items.forEach((r, i) => { const c = canonCode(r[ix.barcode]); if (c && !mine.has(c)) mine.set(c, i); });
  (Array.isArray(db.alias) ? db.alias : []).forEach(a => {
    if (!Array.isArray(a)) return;
    const ok = Number.isInteger(a[0]) && a[0] >= 0 && a[0] < items.length;
    a.slice(1).forEach(raw => {
      const p13 = String(raw).padStart(13, '0'), c = canonCode(p13);
      if (c && mine.has(c)) { own.push({ code: p13, name: clean(items[mine.get(c)][ix.name]) }); return; }
      if (!ok || !c) { bad.push(p13); return; }
      if (seen.has(c)) return; seen.add(c);
      codes.push({ code: p13, digits: String(raw).length, name: clean(items[a[0]][ix.name]) });
    });
  });
  return { codes: codes, own: own, ignored: bad.filter(p => !seen.has(canonCode(p))) };
}
/* Open Food Facts rows of the bundle that share one name and one brand, as [[row index, ...], ...] in bundle order. */
function twinGroups(db){
  const ix = fieldIx(db), g = new Map();
  db.items.forEach((r, i) => { if (r[ix.source] !== 3) return; const k = plain(r[ix.name]) + '|' + r[ix.brand]; if (g.has(k)) g.get(k).push(i); else g.set(k, [i]); });
  return Array.from(g.values()).filter(v => v.length > 1);
}
/* The fixed order of rows that tie in the search: a barcode with the Philippine prefix 480 first, then rows tagged PH, then the rest; inside each the order of the bundle. */
function tieOrder(db, idx){
  const ix = fieldIx(db), rank = i => { const c = canonCode(db.items[i][ix.barcode]); return c && c.slice(0, 3) === '480' ? 0 : /(^|,)PH(,|$)/.test(String(db.items[i][ix.regions] || '')) ? 1 : 2; };
  return idx.slice().sort((a, b) => rank(a) - rank(b) || a - b);
}

    await waitFor(() => readStore().entries.some(e => e.id === 'restorednew1'), 3000, 'the entry from the new backup');

  await step('no script errors were raised during the run', async () => {

  await step('seeded workout is untouched', async () => {

    return kept.workouts.length + ' workout';

  /* Keep this one LAST: every seeded entry and favourite must read back exactly as it was written. */
  await step('data preservation: seeded old entries and favourites are byte-for-byte intact', async () => {
    const now = readStore(), problems = [];
    kept.food.entries.forEach(e => {

    expect(raw.indexOf('"saved":' + JSON.stringify(kept.food.saved).slice(0, -1)) >= 0, 'the seeded favourites are no longer stored as one unchanged run of text at the start of the list');
    return kept.food.entries.length + ' entries and ' + kept.food.saved.length + ' favourites identical; ' + now.entries.length + ' entries and ' + now.saved.length + ' favourites stored now';

}

/* ---------- suite: ranking (the order of search results on a real bundle; run with --db-file PATH) ---------- */
const RANK_MIN_ROWS = 20000;     /* below this the served bundle is a fixture or the old USDA-only build, and the suite says nothing */
const EXACT_SAMPLE = 1000;       /* about how many product names are typed in full */
const EXACT_MAX_FAIL = 0.01;     /* share of those that may fail; measured 0.2 to 0.3 % when the suite was written (a library dish that ends or begins with the words leads instead), 1.6 % with a ranking that lets near-equal names tie */
/* Everyday foods the reference tables (library, curated list, USDA) know by name: a crowd-sourced product that merely carries the same name must not lead. */
const GENERIC = ['rice', 'egg', 'eggs', 'chicken', 'chicken breast', 'banana', 'milk', 'bread', 'oats', 'peanut butter', 'coffee', 'yogurt', 'cheese', 'tuna', 'pasta', 'spaghetti', 'apple', 'potato', 'beef', 'salmon',
  'butter', 'olive oil', 'sugar', 'tomato', 'corn', 'white rice', 'fried rice', 'brown rice', 'fried egg', 'boiled egg', 'pork', 'pork belly', 'bacon', 'ham', 'hotdog', 'water', 'beer', 'mango', 'avocado', 'sweet potato',
  'tofu', 'shrimp', 'oatmeal', 'orange', 'onion', 'garlic', 'carrot', 'broccoli', 'honey', 'almonds', 'peanuts', 'chocolate', 'ice cream', 'pizza', 'burger', 'fries', 'kimchi', 'ramen', 'soy sauce', 'almond milk'];
/* Brand and product queries with the pattern that says "this row is that brand's" (tested against the row's name and the brand shown under it). A brand the served bundle and the library do not carry at all is left out of the count. */
const BRANDS = [['milo', 'milo'], ['bear brand', 'bear brand'], ['skyflakes', 'sky ?flakes'], ['lucky me', 'lucky me'], ['century tuna', 'century'], ['gardenia', 'gardenia'], ['oreo', 'oreo'], ['coke zero', 'coke zero|coca.cola zero'],
  ['nescafe', 'nescaf'], ['kitkat', 'kit ?kat'], ['nutella', 'nutella'], ['pringles', 'pringles'], ['shin ramyun', 'shin ramyun'], ['pocky', 'pocky'], ['yakult', 'yakult'], ['del monte', 'del ?monte'], ['magnolia', 'magnolia'],
  ['san miguel', 'san mig'], ['quaker oats', 'quaker'], ['nissin cup noodles', 'nissin'], ['coca cola', 'coca.?cola|coke'], ['sprite', 'sprite'], ['gatorade', 'gatorade'], ['kopiko', 'kopiko'], ['selecta', 'selecta'], ['chippy', 'chippy'],
  ['oishi', 'oishi'], ['rebisco', 'rebisco'], ['snickers', 'snickers'], ['toblerone', 'toblerone'], ['cadbury', 'cadbury'], ['doritos', 'doritos'], ['spam', 'spam'], ['argentina', 'argentina'], ['555', '555'], ['knorr', 'knorr'],
  ['indomie', 'indomie'], ['samyang', 'samyang'], ['skippy', 'skippy'], ['red bull', 'red bull'], ['cheerios', 'cheerios'], ['heineken', 'heineken']];
/* Everyday words for which Philippine products lead the products: the first two packaged products listed are Philippine ones (tagged PH or a 480 barcode), not
   products from the US, Japan, Korea or the rest of Asia. "ketchup" and "instant noodles" are the step 4 cases: with the US products in, a US store-brand "Ketchup"
   (Aldi) came second among the products and pushed the Philippine banana ketchups out of the first six; this check fails on that list. */
const HOME_FIRST = ['ketchup', 'banana ketchup', 'catsup', 'milo', 'kopiko', 'piattos', 'corned beef', 'pancit canton', 'sardines', 'instant noodles', 'spaghetti sauce', 'milk tea'];
/* Japanese, Korean and other Asian brands typed in Latin letters, with the pattern that says "this row is that brand's": the first row is that brand's, and its name can be read in Latin letters. */
const ASIA_BRANDS = [['buldak', 'buldak'], ['calbee', 'calbee'], ['glico', 'glico|pocky|pretz'], ['nongshim', 'nongshim|nong shim'], ['ottogi', 'ottogi'], ['binggrae', 'binggrae'],
  ['meiji', 'meiji'], ['koka', 'koka'], ['tao kae noi', 'tao ?kae ?noi'], ['aroy d', 'aroy'], ['vitasoy', 'vitasoy'], ['nissin', 'nissin'], ['seven eleven', '7-eleven'], ['kobe bussan', 'kobe bussan'], ['mamee', 'mamee']];
/* Singular typed, the reference row is named in the plural, and the other way round. */
const PLURALS = [['tomato', 'tomatoes'], ['carrot', 'carrots'], ['onion', 'onions'], ['mushroom', 'mushrooms'], ['potatoes', 'potato'], ['mangoes', 'mango']];

async function suiteRanking(){
  const db = await loadJson('../food-db.json').catch(() => null), n = db && Array.isArray(db.items) ? db.items.length : 0;
  if (!db || db.version !== 2 || !Array.isArray(db.fields) || n < RANK_MIN_ROWS) {
    skipped = 'the served food-db.json has ' + n + ' rows' + (db && db.version !== 2 ? ' (version ' + db.version + ')' : '') + '; the ranking checks need a real version 2 bundle of at least ' + RANK_MIN_ROWS + ' rows: run with --db-file PATH';
    return;
  }
  seedStorage({ tab: 'food' });   /* no favourites and nothing logged: your own foods would rank first */
  const ix = fieldIx(db), lib = ((await loadJson('../food-library.json').catch(() => null)) || {}).items || [];
  const srcOf = r => Number(r[ix.source]), nameOf = r => String(r[ix.name] || ''), akaOf = r => Array.isArray(r[ix.aka]) ? r[ix.aka].map(String) : [];
  const brandOf = r => { const b = r[ix.brand]; return typeof b === 'number' ? (b >= 0 && db.brands && db.brands[b] != null ? String(db.brands[b]) : '') : typeof b === 'string' ? b : ''; };
  const bare = s => String(s).replace(/\([^)]*\)/g, ' ');
  const count = [0, 0, 0, 0]; db.items.forEach(r => { const s = srcOf(r); if (s >= 0 && s <= 3) count[s]++; });
  const label = r => r ? r.name + (r.cat ? ' {' + r.cat + '}' : '') + ' [' + r.src + ']' : 'no rows';
  const some = (list, k) => list.slice(0, k || 8).join('; ') + (list.length > (k || 8) ? '; and ' + (list.length - (k || 8)) + ' more' : '');
  const plains = db.items.map(r => plain(nameOf(r))), offNames = new Map();   /* the search key of every row, and how many Open Food Facts rows carry each */
  db.items.forEach((r, i) => { if (srcOf(r) === 3) offNames.set(plains[i], (offNames.get(plains[i]) || 0) + 1); });

  const booted = await step('the app boots with the served bundle and searches it', async () => {
    await openApp('food');
    await search('banana raw', r => r.some(x => x.src === 'usda' || x.src === 'curated' || x.src === 'off'), 30000);
    expect(!appErrors.length, appErrors.join(' | '));
    return n + ' rows (curated ' + count[0] + ', USDA ' + (count[1] + count[2]) + ', Open Food Facts ' + count[3] + '), built "' + (db.built || '') + '", ' + lib.length + ' library items' + (Array.isArray(db.alias) ? ', ' + db.alias.length + ' alias entries' : ', no alias list');
  }, { show: true });
  if (!booted) { check('remaining checks were skipped because the app did not boot', false, ''); return; }

  await step('no Open Food Facts product is first for ' + GENERIC.length + ' everyday foods', async () => {
    const bad = []; let off8 = 0, slots = 0;
    for (const x of GENERIC) {
      const rows = await typed(x);
      if (!rows.length || rows[0].src === 'off') bad.push(x + ' -> ' + label(rows[0]));
      rows.slice(0, 8).forEach(r => { slots++; if (r.src === 'off') off8++; });
    }
    expect(!bad.length, bad.length + ' of ' + GENERIC.length + ': ' + some(bad));
    return 'product rows first: 0 of ' + GENERIC.length + '; product rows in the top 8: ' + off8 + ' of ' + slots;
  }, { show: true });

  /* The curated rows of the bundle: typed by name, or by one of their other names, the list leads with a hand-written row (the curated one, or a library dish known by that name).
     A USDA row may lead only when its whole name is what was typed ("banana raw" for "Banana, raw", "sushi" for "Sushi"); a product row never leads. */
  const curated = db.items.filter(r => srcOf(r) === 0);
  const curatedCheck = async (what, queries) => {
    const bad = [], by = { curated: 0, lib: 0, usda: 0 }; let done = 0;
    for (const x of queries) {
      const rows = await typed(x), f = rows[0]; done++;
      if (f && (f.src === 'curated' || f.src === 'lib')) by[f.src]++;
      else if (f && f.src === 'usda' && plain(f.name) === plain(x)) by.usda++;
      else bad.push(x + ' -> ' + label(f));
    }
    expect(done >= 10, 'only ' + done + ' ' + what + ' to type: the served bundle has ' + curated.length + ' curated rows');
    expect(!bad.length, bad.length + ' of ' + done + ': ' + some(bad));
    return done + ' ' + what + ' typed: a curated row first ' + by.curated + ', a library row ' + by.lib + ', a USDA row named exactly so ' + by.usda;
  };
  const uniq = list => Array.from(new Set(list.map(s => clean(s).toLowerCase()).filter(s => s.length >= 2 && /\p{L}/u.test(s))));
  const curNames = uniq(curated.reduce((a, r) => a.concat([nameOf(r), bare(nameOf(r))]), []));
  const curOther = uniq(curated.reduce((a, r) => a.concat(akaOf(r)), [])).filter(x => curNames.indexOf(x) < 0);
  await step('typing the name of a curated row leads with a curated or library row', () => curatedCheck('names of curated rows', curNames), { show: true });
  await step('typing another name of a curated row leads with a curated or library row', () => curatedCheck('other names of curated rows', curOther), { show: true });

  await step('brand and product queries lead with a product of that brand', async () => {
    const hay = db.items.map(r => nameOf(r) + ' ' + brandOf(r)).concat(lib.map(it => String(it.name || '') + ' ' + String(it.cat || '')));
    const bad = [], absent = []; let done = 0;
    for (const b of BRANDS) {
      const rx = new RegExp(b[1], 'i');
      if (!hay.some(h => rx.test(h))) { absent.push(b[0]); continue; }
      const rows = await typed(b[0]), f = rows[0]; done++;
      if (!f || !rx.test(f.name + ' ' + f.cat)) bad.push(b[0] + ' -> ' + label(f));
    }
    expect(done >= 20, 'only ' + done + ' of the ' + BRANDS.length + ' brands are in the served bundle or the library; not carried: ' + absent.join(', '));
    expect(!bad.length, bad.length + ' of ' + done + ': ' + some(bad));
    return done + ' brand queries, all led by that brand' + (absent.length ? '; not in the served bundle: ' + absent.join(', ') : '');
  }, { show: true });

  /* Philippine products: the rows tagged PH or with a 480 barcode, known by name and brand as the list shows them. */
  /* A row with no brand shows its category ("Packaged") where the brand would be, so such rows are known by name alone, when no product from another market has that name without a brand. */
  const homeKeys = new Set(), homeBare = new Set(), awayBare = new Set();
  db.items.forEach(r => {
    if (srcOf(r) !== 3) return;
    const home = String(r[ix.regions] || '').split(',').indexOf('PH') >= 0 || String(r[ix.barcode] || '').padStart(13, '0').startsWith('480'), b = clean(brandOf(r));
    if (home && b) homeKeys.add(clean(nameOf(r)) + '|' + b);
    else if (!b) (home ? homeBare : awayBare).add(clean(nameOf(r)));
  });
  const isHome = r => r.src === 'off' && (homeKeys.has(clean(r.name) + '|' + clean(r.cat)) || (homeBare.has(clean(r.name)) && !awayBare.has(clean(r.name))));
  const HOME = 'for everyday Philippine words the first two packaged products listed are Philippine ones, not from another market';
  /* A word is tested whenever the bundle itself holds a Philippine product whose name has every word of it (not: whenever one shows in the first rows, which would let a word pass by pushing every Philippine product out of sight). */
  const homeNames = db.items.filter(r => srcOf(r) === 3 && (String(r[ix.regions] || '').split(',').indexOf('PH') >= 0 || String(r[ix.barcode] || '').padStart(13, '0').startsWith('480'))).map(r => ' ' + clean(nameOf(r)).toLowerCase() + ' ');
  const hasHome = x => { const ws = x.split(' '); return homeNames.some(n => ws.every(w => n.indexOf(' ' + w) >= 0)); };
  if (!homeKeys.size) notRun(HOME, 'the served bundle has no Philippine product rows');
  else await step(HOME, async () => {
    const bad = [], skipped = [], unseen = []; let done = 0;
    for (const x of HOME_FIRST) {
      if (!hasHome(x)) { skipped.push(x); continue; }   /* the bundle has no Philippine product for this word */
      /* only the first 12 rows count: a product of another market there ahead of the Philippine ones fails */
      const rows = await typed(x), firstOff = rows.slice(0, 12).filter(r => r.src === 'off').slice(0, 2);
      if (!rows.length) { done++; bad.push(x + ' -> nothing'); continue; }
      if (!firstOff.length) { unseen.push(x); continue; }   /* curated and reference rows fill the first 12: no product of any market is shown */
      done++;
      if (!firstOff.every(isHome)) bad.push(x + ' -> ' + rows.slice(0, 4).map(r => label(r) + (isHome(r) ? ' (PH)' : '')).join(' | '));
    }
    expect(done >= 8, 'only ' + done + ' of the ' + HOME_FIRST.length + ' words have a Philippine product in the first 12 rows; without one in the bundle: ' + skipped.join(', ') + '; with none in the first 12 rows: ' + unseen.join(', '));
    expect(unseen.length <= 2, unseen.length + ' words show no product at all in the first 12 rows: ' + unseen.join(', '));
    expect(!bad.length, bad.length + ' of ' + done + ': ' + some(bad, 4));
    return done + ' words: the first two products listed are Philippine each time' + (skipped.length ? '; no Philippine product in the bundle for: ' + skipped.join(', ') : '') + (unseen.length ? '; reference rows fill the first 12 for: ' + unseen.join(', ') : '');
  }, { show: true });

  /* The products of the Japan, Korea and Asia pools: packaged rows tagged for one of those markets and for none of the Philippines, the US or the UK. A bundle with a thousand of them carries the pools, and then every brand below must be in it under its Latin name: a brand that is missing (its rows written in Japanese again, or left out) fails the check instead of being skipped. */
  const asiaCount = db.items.filter(r => { if (srcOf(r) !== 3) return false; const g = String(r[ix.regions] || '').split(','); return (g.indexOf('JP') >= 0 || g.indexOf('KR') >= 0 || g.indexOf('AS') >= 0) && g.indexOf('PH') < 0 && g.indexOf('US') < 0 && g.indexOf('UK') < 0; }).length;
  const ASIA = 'Japanese, Korean and other Asian brands typed in Latin letters lead with that brand, named in Latin letters';
  if (asiaCount < 1000) notRun(ASIA, 'the served bundle has no Japan, Korea and Asia pools (' + asiaCount + ' such products)');
  else await step(ASIA, async () => {
    const hay = db.items.map(r => nameOf(r) + ' ' + brandOf(r));
    const bad = [], absent = []; let done = 0;
    for (const b of ASIA_BRANDS) {
      const rx = new RegExp(b[1], 'i');
      if (!hay.some(h => rx.test(h))) { absent.push(b[0]); continue; }
      const rows = await typed(b[0]), f = rows[0]; done++;
      if (!f || !rx.test(f.name + ' ' + f.cat) || !/[A-Za-z]{3}/.test(f.name)) bad.push(b[0] + ' -> ' + label(f));
      /* "seven eleven" is found through the other name the importer gives 7-Eleven rows: the first six are all that shop's */
      if (b[0] === 'seven eleven' && !(rows.length >= 6 && rows.slice(0, 6).every(r => /^7-eleven$/i.test(r.cat)))) bad.push(b[0] + ' -> the first six are not all 7-Eleven products: ' + rows.slice(0, 6).map(label).join(' | '));
    }
    expect(!absent.length, 'the bundle carries ' + asiaCount + ' Japanese, Korean and Asian products but none under: ' + absent.join(', '));
    expect(!bad.length, bad.length + ' of ' + done + ': ' + some(bad));
    return done + ' brand queries, all led by that brand';
  }, { show: true });

  await step('typing the exact name of a product lists that product first, unless a curated, library or USDA row has that name', async () => {
    /* distinct names of Open Food Facts rows, one to three words, plain ASCII, in bundle order; every k-th is typed in lower case */
    const seenNames = new Set(), all = [];
    db.items.forEach((r, i) => { if (srcOf(r) !== 3) return; const raw = nameOf(r); if (/[^\x20-\x7e]/.test(raw)) return; const p = plains[i]; if (p.length < 3 || p.split(' ').length > 3 || !/[a-z]/.test(p) || seenNames.has(p)) return; seenNames.add(p); all.push(p); });
    expect(all.length >= 200, 'only ' + all.length + ' product names to choose from');
    const k = Math.max(1, Math.ceil(all.length / EXACT_SAMPLE)), sample = all.filter((x, i) => i % k === 0);
    /* a reference row "has that name": its whole name, its name without the bracketed part, one of the comma-separated parts of a USDA-style name, or one of its other names; plural endings aside */
    const ref = new Set(), addRef = (name, aka) => { const b = bare(name); [name, b].concat(b.split(',')).concat(aka || []).forEach(s => { const p = stemAll(plain(s)); if (p) ref.add(p); }); };
    db.items.forEach(r => { const s = srcOf(r); if (s !== 3) addRef(nameOf(r), s === 0 ? akaOf(r) : []); });
    lib.forEach(it => addRef(String(it.name || ''), Array.isArray(it.aka) ? it.aka : []));
    let first = 0, excused = 0; const fail = [];
    for (const p of sample) {
      const rows = await typed(p), f = rows[0];
      if (f && f.src === 'off' && plain(f.name) === p) first++;
      else if (ref.has(stemAll(p))) excused++;
      else fail.push(p + ' -> ' + label(f));
    }
    const pct = v => (Math.round(v * 10000) / 100) + ' %', rate = fail.length / sample.length;
    const line = sample.length + ' of ' + all.length + ' names typed: the product first ' + first + ' (' + pct(first / sample.length) + '), a reference row has the name ' + excused + ', failures ' + fail.length + ' = ' + pct(rate) + ' (allowed: ' + pct(EXACT_MAX_FAIL) + ')';
    expect(rate <= EXACT_MAX_FAIL, line + ': ' + some(fail, 12));
    return line + (fail.length ? ': ' + some(fail, 6) : '');
  }, { show: true });

  await step('singular and plural find each other: "tomato" finds "Tomatoes, raw", "potatoes" finds "Potato"', async () => {
    const firstPart = s => plain(bare(s).split(',')[0]);
    const refRows = new Set(db.items.filter(r => srcOf(r) !== 3).map(r => firstPart(nameOf(r))).concat(lib.map(it => firstPart(String(it.name || '')))));
    const bad = []; let done = 0;
    for (const pair of PLURALS) {
      if (!refRows.has(pair[1])) continue;   /* no reference row is named so in this bundle */
      const rows = await typed(pair[0]); done++;
      if (!rows.length || rows[0].src === 'off' || !rows.slice(0, 3).some(r => r.src !== 'off' && firstPart(r.name) === pair[1])) bad.push(pair[0] + ' -> ' + rows.slice(0, 3).map(label).join(' | '));
    }
    expect(done >= 4, 'only ' + done + ' of the ' + PLURALS.length + ' pairs could be tried on this bundle');
    expect(!bad.length, bad.length + ' of ' + done + ': ' + some(bad));
    return done + ' pairs: typed one way, a reference row named the other way is in the first three and no product leads';
  });

  await step('accents are folded: a product whose name has an accented letter is found by typing it without', async () => {
    /* names of two or more words such as "Jalapeño Houmous", typed as "jalapeno houmous": a row with the accented spelling must be in the list */
    const picks = [], seenP = new Set();
    for (let i = 0; i < db.items.length && picks.length < 12; i++) {
      const r = db.items[i]; if (srcOf(r) !== 3) continue;
      const raw = nameOf(r), p = plains[i]; if (!/[À-ɏ]/.test(raw) || /[^\x00-\x7f]/.test(p) || p.split(' ').length < 2 || p.length < 8 || seenP.has(p) || offNames.get(p) > 6) continue;
      seenP.add(p); picks.push({ p: p, raw: clean(raw) });
    }
    if (picks.length < 3) return 'only ' + picks.length + ' such names in the served bundle: nothing to try';
    const bad = [];
    for (const x of picks) { const rows = await typed(x.p); if (!rows.some(r => plain(r.name) === x.p && /[À-ɏ]/.test(r.name))) bad.push('"' + x.p + '" does not list "' + x.raw + '" (first: ' + label(rows[0]) + ')'); }
    expect(!bad.length, bad.length + ' of ' + picks.length + ': ' + some(bad));
    return picks.length + ' names, for example "' + picks[0].p + '" finds "' + picks[0].raw + '"';
  });

  await step('digits: a short number such as "555" lists the foods that carry it, a longer number waits to be a barcode', async () => {
    const words = new Map();   /* numbers of two to four digits that stand as a word in a name */
    plains.forEach(p => { (p.match(/(^| )\d{2,4}(?= |$)/g) || []).forEach(w => { const d = w.trim(); words.set(d, (words.get(d) || 0) + 1); }); });
    const pick = ['555', '100'].filter(d => words.has(d)).concat(Array.from(words.keys())).filter((d, i, l) => l.indexOf(d) === i).slice(0, 3);
    expect(pick.length > 0, 'no name in the served bundle carries a number of two to four digits');
    for (const d of pick) {
      const rows = await typed(d);
      expect(rows.length > 0, '"' + d + '" lists nothing although ' + words.get(d) + ' names carry it');
      expect(rows.some(r => new RegExp('(^|[^0-9])' + d + '([^0-9]|$)').test(r.name + ' ' + r.cat)), '"' + d + '" lists: ' + names(rows));
    }
    for (const text of ['48077', '480777027']) { const rows = await typed(text); expect(!rows.length, '"' + text + '" lists: ' + names(rows)); }
    return pick.map(d => '"' + d + '"').join(', ') + ' list foods; 48077 and 480777027 list nothing';
  });

  /* The next two only have something to check on a bundle built with the newer import rules. */
  const groups = twinGroups(db), TWINS = 'rows of one name and brand are all listed, in the fixed order, each with its calories per 100 g';
  if (!groups.length) notRun(TWINS, 'the served bundle has no two Open Food Facts rows with the same name and brand');
  else await step(TWINS, async () => {
    /* The name is typed; the rows of the group tie, so they must come out with the Philippine barcode (480...) first, then the rows tagged PH, then the rest, each in bundle order.
       When the list is not full every row of the group must be there; a full list (12 rows) may cut the group short or, when reference rows fill it, leave it out. */
    const bad = []; let done = 0, tried = 0;
    for (const g of groups.filter(v => v.length <= 6 && v.every(i => Number(db.items[i][ix.per]) !== 1))) {
      if (tried >= 40) break;
      const p = plains[g[0]], brand = clean(brandOf(db.items[g[0]])); if (!brand || p.length < 3 || !/[a-z]/.test(p)) continue;
      tried++;
      const rows = await typed(p), mine = rows.filter(r => r.src === 'off' && plain(r.name) === p && r.cat === brand && r.per);
      const want = tieOrder(db, g).map(i => Math.round(Number(db.items[i][ix.kcal]) || 0)), got = mine.map(r => num(r.per.split('kcal')[0])), full = rows.length >= 12;
      if (full && got.length < 2) continue;
      done++;
      if ((!full && got.length !== want.length) || got.join() !== want.slice(0, got.length).join()) bad.push(p + ' {' + brand + '}: listed ' + (got.join('/') || 'none') + ' kcal/100 g, the bundle has ' + want.join('/') + ' in that order');
    }
    expect(done > 0, 'none of the ' + tried + ' groups tried was listed');
    expect(!bad.length, bad.length + ' of ' + done + ': ' + some(bad, 5));
    return done + ' groups checked (' + groups.length + ' in the bundle)';
  }, { show: true });

  const plan = aliasPlan(db), ALIASES = 'barcodes from the "alias" list find their row offline, headed "Same product, another pack"';
  if (!plan.codes.length) notRun(ALIASES, 'the served bundle has no "alias" list');
  else await step(ALIASES, async () => {
    const before = lookupRequests().length, k = Math.max(1, Math.floor(plan.codes.length / 20)), pick = plan.codes.filter((a, i) => i % k === 0).slice(0, 20).concat(plan.codes.filter(a => a.digits < 8).slice(0, 3));
    for (const a of pick) {
      const rows = await typed(a.code);
      expect(rows.length === 1 && rows[0].name === a.name, a.code + ' should find "' + a.name + '", the list shows: ' + names(rows));
      expect(txt(q('#food-res-head')) === ALIAS_HEAD, a.code + ' is headed "' + txt(q('#food-res-head')) + '"');
    }
    for (const o of plan.own.slice(0, 5)) { const rows = await typed(o.code); expect(rows.length === 1 && rows[0].name === o.name && txt(q('#food-res-head')) === BARCODE_HEAD, 'the own barcode ' + o.code + ' of "' + o.name + '" shows: ' + names(rows) + ', headed "' + txt(q('#food-res-head')) + '"'); }
    expect(lookupRequests().length === before, 'requests to the lookup services: ' + lookupRequests().slice(before).join(', '));
    return pick.length + ' of ' + plan.codes.length + ' alias barcodes tried';
  }, { show: true });

  /* A restaurant in the library is found by its name: its own menu rows come before the packaged products of a brand of the same name (Starbucks PH drinks before bottled Starbucks drinks from the US). */
  const HOME_CATS = ['home dish', 'street food & snacks', 'noodles', 'rice & staples', 'breakfast (silog)', 'bread & bakery', 'dessert', 'drinks'];
  const places = new Map(); lib.forEach(it => { const c = String(it.cat || '').trim(); if (c && !HOME_CATS.includes(c.toLowerCase())) places.set(c, (places.get(c) || 0) + 1); });
  const PLACES = 'typing a restaurant\'s name lists its own menu rows before any packaged product';
  const placeList = Array.from(places).filter(([c, k]) => k >= 2).map(([c]) => c);
  if (!placeList.length) notRun(PLACES, 'the library has no restaurant with two or more rows');
  else await step(PLACES, async () => {
    const bad = []; let done = 0;
    for (const c of placeList) {
      const word = plain(c).replace(/ ph$/, ''); if (word.length < 3) continue;
      const rows = await typed(word), firstOff = rows.findIndex(r => r.src === 'off'), own = rows.filter((r, i) => r.cat === c && (firstOff < 0 || i < firstOff)).length;
      done++;
      if (own < Math.min(2, places.get(c))) bad.push('"' + word + '" -> ' + names(rows));
    }
    expect(!bad.length, bad.length + ' of ' + done + ': ' + some(bad, 4));
    return done + ' restaurants typed';
  }, { show: true });

  /* A small US can or bottle prints an 8-digit UPC-E; the same product's 12-digit UPC-A (multipacks, receipts, other apps) must find the row stored under the short code, and the short code typed must find it too. */
  const upcA = c => {   /* the 12-digit UPC-A of a canonical 13-digit code that holds a valid UPC-E, else null (written apart from the app's own upceToUpca) */
    const s = String(c).padStart(13, '0'); if (!/^00000[01]/.test(s) || s.slice(5, 7) === '00') return null;
    const e = s.slice(5), m = e.slice(1, 7), x = +m[5], ns = e[0];
    const a = ns + (x <= 2 ? m.slice(0, 2) + x + '0000' + m.slice(2, 5) : x === 3 ? m.slice(0, 3) + '00000' + m.slice(3, 5) : x === 4 ? m.slice(0, 4) + '00000' + m[4] : m.slice(0, 5) + '0000' + x);
    const sum = a.split('').reduce((t, d, i) => t + (+d) * (i % 2 ? 1 : 3), 0);
    return (10 - sum % 10) % 10 === +e[7] ? a + e[7] : null;
  };
  const known = new Set(); db.items.forEach(r => { if (r[ix.barcode]) known.add(String(r[ix.barcode]).padStart(13, '0')); }); (db.alias || []).forEach(a => a.slice(1).forEach(c => known.add(String(c).padStart(13, '0'))));
  const shortRows = []; db.items.forEach(r => { const a = r[ix.barcode] ? upcA(r[ix.barcode]) : null; if (a && !known.has('0' + a) && !shortRows.some(x => x.name === nameOf(r))) shortRows.push({ a: a, e: String(r[ix.barcode]).padStart(13, '0').slice(5), name: nameOf(r) }); });
  const UPCE = 'a 12-digit UPC-A finds the row stored under its 8-digit UPC-E, and the UPC-E finds it too';
  if (!shortRows.length) notRun(UPCE, 'the served bundle has no row stored under a UPC-E');
  else await step(UPCE, async () => {
    const pick = shortRows.filter((x, i) => i % Math.max(1, Math.floor(shortRows.length / 10)) === 0).slice(0, 10);
    for (const x of pick) for (const code of [x.a, x.e]) {
      const rows = await typed(code);
      expect(rows.length === 1 && rows[0].name === x.name, code + ' should find "' + x.name + '", the list shows: ' + names(rows));
    }
    return pick.length + ' of ' + shortRows.length + ' rows stored under a UPC-E, e.g. ' + pick[0].a + ' and ' + pick[0].e + ' -> ' + pick[0].name;
  }, { show: true });

  await step('no script errors were raised during the run', async () => {
    type('#ff-name', ''); await wait(200);
    expect(!appErrors.length, appErrors.join(' | '));
    return 'none';
  });
}

/* ---------- suites: pick one with ?suite=NAME ---------- */
const SUITES = {
  baseline: { about: 'The app as it was before the food-database change: stored data, search, logging, editing, deleting, settings.', run: suiteBaseline },
  v2: { about: 'The food-database upgrade against a version 2 bundle: filter pills, pictures and icons, brand search, offline barcodes and alias barcodes, same-named rows, extra nutrients, sodium or salt, schema marker, backups.', run: suiteV2 },
  ranking: { about: 'The order of search results on a real bundle (--db-file): reference rows before same-named products, curated rows, brands, exact product names, plurals, accents, digits, same-named rows, alias barcodes.', run: suiteRanking }
};

async function main(){
  if (!isLocalTestHost()) { /* never touch real data: do nothing at all outside a local test server */
    document.getElementById('result').textContent = 'This test page only runs on a local test server (127.0.0.1). Nothing was changed.';
    return;
  }
  const suite = SUITES[suiteName];
  try {
    if (!suite) check('suite "' + suiteName + '" exists', false, 'known suites: ' + Object.keys(SUITES).join(', '));
    else await suite.run();
  } catch (e) {
    check('suite "' + suiteName + '" ran to the end', false, 'uncaught: ' + (e && (e.stack || e.message) || e));
  }
  publish(true);
}
window.addEventListener('error', ev => { check('the test page itself raised no error', false, ev && ev.message || 'unknown error'); });
window.addEventListener('unhandledrejection', ev => { const r = ev && ev.reason; check('the test page itself raised no error', false, 'unhandled promise rejection: ' + (r && r.message || r)); });
publish(false);
main();
})();
</script>
</body>
